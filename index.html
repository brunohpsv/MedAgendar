        const timeToMin = (t) => {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };

        const minToTime = (m) => {
            const h = Math.floor(m / 60);
            const min = m % 60;
            return `${h.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
        };

        const generateScheduleFromConfig = (config) => {
            if (!config) return [];
            const schedule = [];
            const today = new Date();
            const daysOfWeek = config.daysOfWeek || [];
            const specificDates = config.specificDates || [];

            if (daysOfWeek.length === 0 && specificDates.length === 0) return [];

            for (let i = 0; i < 30; i++) {
                const currentDate = new Date(today);
                currentDate.setDate(today.getDate() + i);
                const dayOfWeek = currentDate.getDay();
                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dayNum = String(currentDate.getDate()).padStart(2, '0');
                const dateStr = `${year}-${month}-${dayNum}`;

                const isDayOfWeekMatch = daysOfWeek.includes(dayOfWeek);
                const isSpecificDateMatch = specificDates.includes(dateStr);

                if (isDayOfWeekMatch || isSpecificDateMatch) {
                    const slots = [];
                    let startTime = config.startTime || "08:00";
                    let endTime = config.endTime || "18:00";
                    if (dayOfWeek === 6 && (config.saturdayStartTime || config.saturdayEndTime)) {
                        startTime = config.saturdayStartTime || config.startTime || "08:00";
                        endTime = config.saturdayEndTime || "12:00";
                    } else if (dayOfWeek === 0 && (config.sundayStartTime || config.sundayEndTime)) {
                        startTime = config.sundayStartTime || config.startTime || "08:00";
                        endTime = config.sundayEndTime || "12:00";
                    }

                    let currentMin = timeToMin(startTime);
                    const endMin = timeToMin(endTime);
                    const duration = Number(config.slotDuration) || 30;
                    const interval = Number(config.minInterval) || 0;
                    
                    while (currentMin + duration <= endMin) {
                        const slotStart = currentMin;
                        const slotEnd = currentMin + duration;
                        let isDuringBreak = false;
                        if (config.breaks?.lunch?.active) {
                            const lStart = timeToMin(config.breaks.lunch.start || "12:00");
                            const lEnd = timeToMin(config.breaks.lunch.end || "13:30");
                            if (!(slotEnd <= lStart || slotStart >= lEnd)) isDuringBreak = true;
                        }
                        if (config.breaks?.snack?.active) {
                            const sStart = timeToMin(config.breaks.snack.start || "16:00");
                            const sEnd = timeToMin(config.breaks.snack.end || "16:30");
                            if (!(slotEnd <= sStart || slotStart >= sEnd)) isDuringBreak = true;
                        }
                        if (!isDuringBreak) slots.push(minToTime(currentMin));
                        currentMin += duration + interval;
                    }
                    if (slots.length > 0) {
                        const labels = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
                        const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
                        const label = `${labels[dayOfWeek]}, ${dayNum} ${months[currentDate.getMonth()]}`;
                        schedule.push({ date: dateStr, label: label, slots: slots });
                    }
                }
            }
            return schedule;

                    .normalize('NFD')

                    .replace(/[^a-z0-9]/g, '');

            const cleanStr = (str) => {

                    if (!doc || !doc.name) return false;

                    let matchesSearch = true;
                    if (sNorm || sClean) {
                        const docNameNorm = normalizeStr(doc.name);

                        const specs = Array.isArray(doc.specialties) ? doc.specialties : [doc.specialties || ''];
                        const specMatch = specs.some(s =>

                        const crmMatch = doc.crm && (normalizeStr(doc.crm).includes(sNorm) || cleanStr(doc.crm).includes(sClean));
                        const cnpjMatch = doc.cnpj && (normalizeStr(doc.cnpj).includes(sNorm) || cleanStr(doc.cnpj).includes(sClean));

                            const pCrmMatch = prof.crm && (normalizeStr(prof.crm).includes(sNorm) || cleanStr(prof.crm).includes(sClean));

        const DoctorDetails = ({ doctor, appointments, onConfirm }) => {
            if (!doctor) return <div className="p-20 text-center font-black uppercase text-slate-900">Carregando profissional...</div>;
            const [step, setStep] = useState('schedule');
            const [selectedDayDate, setSelectedDayDate] = useState("");
            const [selectedSlot, setSelectedSlot] = useState("");
            const [selectedProfessionalId, setSelectedProfessionalId] = useState("");
            const [patientData, setPatientData] = useState({ name: '', phone: '', cpf: '' });

            const selectedProfessional = useMemo(() => {
                if (!doctor.isClinic || !selectedProfessionalId) return null;
                return (doctor.professionals || []).find(p => p.id === selectedProfessionalId);
            }, [doctor, selectedProfessionalId]);

            const activeWorkConfig = (selectedProfessional ? selectedProfessional.workConfig : doctor.workConfig) || DEFAULT_WORK_CONFIG;
            const activeMaxSlots = selectedProfessional ? selectedProfessional.maxSlotsPerTime : doctor.maxSlotsPerTime;

            const activeSchedule = useMemo(() => {
                const rawSchedule = (selectedProfessional ? selectedProfessional.schedule : doctor.schedule) || [];
                const daysOfWeek = activeWorkConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                const specificDates = activeWorkConfig?.specificDates || [];
                return rawSchedule.filter(day => {
                    if (!day.date || !day.slots || day.slots.length === 0) return false;
                    const isSpecificDate = specificDates.includes(day.date);
                    const dateObj = new Date(day.date + 'T12:00:00');
                    const isDayOfWeek = daysOfWeek.includes(dateObj.getDay());
                    return isDayOfWeek || isSpecificDate;
                });
            }, [doctor, selectedProfessional, activeWorkConfig]);

            useEffect(() => {
                if (activeSchedule && activeSchedule.length > 0) {
                    if (!activeSchedule.some(d => d.date === selectedDayDate)) {
                        setSelectedDayDate(activeSchedule[0].date);
                    }
                } else {
                    setSelectedDayDate("");
                }
            }, [activeSchedule, selectedDayDate]);

            const availableSlots = useMemo(() => {
                if (!activeSchedule) return [];
                const day = activeSchedule.find(d => d.date === selectedDayDate);
                if (!day) return [];
                
                const rules = activeWorkConfig.groupingRules || [];
                const capacities = activeWorkConfig.slotCapacities || {};
                const globalMax = activeMaxSlots || 1;
                const standardDur = Number(activeWorkConfig.slotDuration) || 30;
                
                // Get day of week (0-6)
                const dateObj = new Date(selectedDayDate + 'T12:00:00');
                const dayOfWeek = dateObj.getDay();

                // Confirmed appointments on this date for this doctor/professional
                const dayConfirmedApps = (appointments || []).filter(app => 
                    app.doctorId === doctor.id && 
                    (!doctor.isClinic || !selectedProfessionalId || app.professionalId === selectedProfessionalId) &&
                    app.date === day.date && 
                    app.status === 'confirmed'
                );

                return day.slots.map(slot => {
                    // Find applicable rule
                    // Priority: Specific Date > Days of Week > Specific Time Capacity > Global Max
                    let maxSlots = globalMax;
                    
                    // 1. Check specific time capacity
                    if (capacities[slot] !== undefined) {
                        maxSlots = capacities[slot];
                    }

                    // 2. Check rules (newest first)
                    const reversedRules = [...rules].reverse();
                    const applicableRules = reversedRules.filter(rule => rule.times.includes(slot) || rule.times.includes('all'));
                    
                    // Specific date rule
                    const dateRule = applicableRules.find(r => r.type === 'date' && r.date === selectedDayDate);
                    if (dateRule) {
                        maxSlots = dateRule.capacity;
                    } else {
                        // Days of week rule
                        const daysRule = applicableRules.find(r => r.type === 'days' && r.days.includes(dayOfWeek));
                        if (daysRule) {
                            maxSlots = daysRule.capacity;
                        } else {
                            // All dates rule
                            const allDatesRule = applicableRules.find(r => r.type === 'all');
                            if (allDatesRule) {
                                maxSlots = allDatesRule.capacity;
                            }
                        }
                    }

                    const slotStartMin = timeToMin(slot);
                    const slotEndMin = slotStartMin + standardDur;

                    // Overlap detection: accurately checks standard, rescheduled, and extended appointments
                    let overlappingCount = 0;
                    let hasBlockingOverlap = false;

                    for (const app of dayConfirmedApps) {
                        const appStartMin = timeToMin(app.time);
                        const appDuration = (Number(app.duration) || standardDur) + (Number(app.tolerance) || 0);
                        const appEndMin = appStartMin + appDuration;

                        // Check if time windows intersect
                        if (slotStartMin < appEndMin && slotEndMin > appStartMin) {
                            overlappingCount++;
                            // If appointment is extended or covers more than one standard slot, it blocks the slot entirely
                            if (app.isExtendedTime || appDuration > standardDur) {
                                hasBlockingOverlap = true;
                            }
                        }
                    }

                    const isAvailable = (overlappingCount < maxSlots) && !hasBlockingOverlap;

                    return {
                        time: slot,
                        count: overlappingCount,
                        max: maxSlots,
                        available: isAvailable
                    };
                });
            }, [doctor, selectedDayDate, appointments, selectedProfessionalId, activeSchedule, activeWorkConfig, activeMaxSlots]);

            // Clear selected slot if it becomes unavailable
            useEffect(() => {
                if (selectedSlot && !availableSlots.some(s => s.time === selectedSlot && s.available)) {
                    setSelectedSlot("");
                }
            }, [availableSlots, selectedSlot]);

            const finalize = () => {
                onConfirm({ 
                    id: Math.random().toString(36).substr(2, 6).toUpperCase(), 
                    doctorId: doctor.id,

        const ProfessionalSignup = ({ onSignup }) => {

            // Location and Map state

            const [signupState, setSignupState] = useState('');
            const [signupMapUrl, setSignupMapUrl] = useState('');
            
            const addSpecialty = () => setSpecialties([...specialties, '']);
            const updateSpecialty = (index, value) => { const newSpecs = [...specialties]; newSpecs[index] = value; setSpecialties(newSpecs); };
            const removeSpecialty = (index) => { if (specialties.length > 1) setSpecialties(specialties.filter((_, i) => i !== index)); };
            
            const addClinic = () => setClinics([...clinics, '']);
            const updateClinic = (index, value) => { const newClinics = [...clinics]; newClinics[index] = value; setClinics(newClinics); };
            const removeClinic = (index) => { if (clinics.length > 1) setClinics(clinics.filter((_, i) => i !== index)); };

            const locationQueryStr = [signupAddress, signupCity, signupState].filter(Boolean).join(', ');

            const handleSubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.currentTarget);
                const isPJ = partnerType === 'pj';
                const mapUrlValue = formData.get('mapUrl');
                const addressVal = formData.get('address') || '';
                const cityVal = formData.get('city') || '';
                const stateVal = formData.get('state') || '';
                const fullAddressStr = [addressVal, cityVal, stateVal].filter(Boolean).join(', ');
                const finalMapUrl = mapUrlValue && String(mapUrlValue).trim() !== ''
                    ? String(mapUrlValue).trim()
                    : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddressStr)}`;
                
                const nameVal = formData.get('name') || '';
                const emailVal = String(formData.get('email') || '').trim();
                const crmVal = isPJ ? '' : (formData.get('crm') || '');
                const cnpjVal = isPJ ? (formData.get('cnpj') || '') : '';
                const mainSpecVal = formData.get('mainSpecialty') || 'Geral';
                const bioVal = formData.get('bio') || '';
                const priceVal = Number(formData.get('price')) || 0;
                const accessCodeVal = String(formData.get('accessCode') || '').trim().toUpperCase();

                const newDoctor = {
                    id: Math.random().toString(36).substr(2, 9),
                    name: nameVal,
                    email: emailVal,
                    crm: crmVal,
                    cnpj: cnpjVal,
                    type: partnerType, // 'pf' or 'pj'
                    isClinic: isPJ,
                    specialties: isPJ ? [mainSpecVal] : specialties.filter(s => s && s.trim() !== ''),
                    clinics: isPJ ? [nameVal] : clinics.filter(c => c && c.trim() !== ''),
                    city: cityVal,
                    state: stateVal,
                    address: addressVal,

            if (step === 'success') return <div className="lg:max-w-none mx-auto py-12 lg:py-8 text-center border border-red-600 bg-white shadow-2xl mt-10"><h2 className="text-xl lg:text-lg font-black text-red-600 mb-1 uppercase">Cadastrado com Sucesso!</h2><p className="text-[11px] font-bold text-slate-900 uppercase tracking-widest mb-4">Seu acesso precisa ser liberado pelo administrador no painel admin. Você já pode acessar o painel profissional com sua senha.</p><button onClick={() => window.location.hash = '#home'} className="mt-4 px-8 py-3 bg-red-600 text-white font-black uppercase text-[11px] hover:bg-red-700 transition-all active-scale shadow-lg">INÍCIO</button></div>;

            return (

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-3">

                                        />

                                </div>

                                {/* Bloco do Link do Google Maps no Cadastro */}
                                <div className="p-4 bg-slate-50 border-2 border-slate-200 space-y-2 my-3">
                                    <div className="space-y-1">
                                        <label className="text-[9px] font-black uppercase tracking-widest text-slate-900 flex items-center gap-2">

                                            Link Personalizado do Google Maps / Coordenadas (Opcional)
                                        </label>
                                        <div className="flex flex-col sm:flex-row gap-2">
                                            <input

                                            <a

                                                target="_blank"

                                <div className="space-y-1"><label className="text-[10px] font-black uppercase tracking-widest text-slate-900">Biografia</label><textarea name="bio" required className="w-full p-3 lg:p-2 border border-slate-200 font-black uppercase text-[12px] min-h-[80px] lg:min-h-[60px] outline-none focus:border-red-600"></textarea></div>
                                <div className="flex items-center gap-3 p-3 lg:p-2 bg-slate-50 border border-slate-100"><input type="checkbox" name="onlineConsultation" id="onlineConsultation" className="w-4 h-4 accent-red-600" /><label htmlFor="onlineConsultation" className="text-[11px] font-black uppercase text-slate-900 cursor-pointer">Ofereço Consulta Online</label></div>
                                <div className="space-y-1 pt-2 lg:pt-1"><label className="text-[10px] font-black uppercase tracking-widest text-slate-900">Senha Painel</label><input name="accessCode" required type="password" placeholder="CRIE UMA SENHA" className="w-full p-3 lg:p-2 border border-slate-200 bg-white text-slate-900 font-black uppercase text-[12px] text-center outline-none focus:border-red-600" /></div>
                                <button type="submit" className="w-full py-4 lg:py-3 bg-red-600 text-white font-black uppercase text-[12px] tracking-widest hover:bg-red-700 transition-all shadow-lg active-scale">FINALIZAR CADASTRO</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfessionalDashboard = ({ doctors, appointments, setDoctors, loggedInId, loggedInProfessionalId, onLogin, onLogout, onCancelAppointment, onUpdateAppointment, onConfirmAppointment, supportMessages = [], onSendSupportMessage, showNotification, showConfirmation }) => {
            const formatDateLong = (dateStr) => {
                if (!dateStr) return 'DATA INVÁLIDA';
                if (!dateStr.includes('-')) {
                    return dateStr.toUpperCase()
                        .replace('QUA', 'QUARTA')
                        .replace('SEG', 'SEGUNDA')
                        .replace('TER', 'TERÇA')
                        .replace('QUI', 'QUINTA')
                        .replace('SEX', 'SEXTA')
                        .replace('SÁB', 'SÁBADO')
                        .replace('DOM', 'DOMINGO');
                }
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr.toUpperCase();
                const [year, month, day] = parts;
                const date = new Date(year, month - 1, day);
                if (isNaN(date.getTime())) return dateStr.toUpperCase();
                let label = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).toUpperCase();
                return label.replace('-FEIRA', '');
            };

            const [accessCode, setAccessCode] = useState('');
            const [loginStep, setLoginStep] = useState('password'); // 'password', 'select_prof'
            const [tempClinic, setTempClinic] = useState(null);
            const [activeTab, setActiveTab] = useState('appointments');
            const [chatInput, setChatInput] = useState('');
            const [localDoctor, setLocalDoctor] = useState(null);
            const [isGroupingOpen, setIsGroupingOpen] = useState(false);
            const [selectedGroupingTimes, setSelectedGroupingTimes] = useState(['all']);
            const [timeToConfigure, setTimeToConfigure] = useState('all');
            const [groupingQty, setGroupingQty] = useState(1);
            const [tempQuantities, setTempQuantities] = useState({}); // Map of time -> qty
            const [groupingRuleType, setGroupingRuleType] = useState('all'); // 'all', 'date', 'days'
            const [groupingRuleDate, setGroupingRuleDate] = useState('');
            const [groupingRuleDays, setGroupingRuleDays] = useState([]);
            const [newProf, setNewProf] = useState({ name: '', specialties: '', image: '' });
            const [editingProfessionalId, setEditingProfessionalId] = useState('company');
            const [calCurrentDate, setCalCurrentDate] = useState(() => new Date());
            const notifStorageKey = 'medagendar_viewed_cancelled_apps_' + (loggedInProfessionalId ? `${loggedInId}_${loggedInProfessionalId}` : (loggedInId || 'default'));
            const [viewedNotifIds, setViewedNotifIds] = useState(() => {
                try {
                    const saved = localStorage.getItem(notifStorageKey);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });

            // Rescheduling Flow State
            const [reschedulingApp, setReschedulingApp] = useState(null);
            const [rescheduleType, setRescheduleType] = useState(null); // null (question), 'standard', 'extended'
            const [rescheduleDuration, setRescheduleDuration] = useState(60); // minutes
            const [rescheduleTolerance, setRescheduleTolerance] = useState(15); // minutes
            const [rescheduleSelectedDate, setRescheduleSelectedDate] = useState('');
            const [rescheduleSelectedTime, setRescheduleSelectedTime] = useState('');
            const [rescheduleNotes, setRescheduleNotes] = useState('');
            const [rescheduleAttachments, setRescheduleAttachments] = useState([]);

            const loggedInDoctor = doctors.find(d => d.id === loggedInId);

            // Calculate Available Schedule for Rescheduling (Supports Standard & Extended Duration with Tolerance)
            const calculatedRescheduleSchedule = useMemo(() => {
                if (!reschedulingApp || !rescheduleType) return [];

                const docObj = localDoctor || loggedInDoctor;
                if (!docObj) return [];

                const targetProf = (reschedulingApp.professionalId || loggedInProfessionalId)
                    ? (docObj.professionals || []).find(p => p.id === (reschedulingApp.professionalId || loggedInProfessionalId))
                    : null;

                const activeWorkConfig = (targetProf ? targetProf.workConfig : docObj.workConfig) || DEFAULT_WORK_CONFIG;
                const globalMax = (targetProf ? targetProf.maxSlotsPerTime : docObj.maxSlotsPerTime) || 1;
                const rules = activeWorkConfig.groupingRules || [];
                const capacities = activeWorkConfig.slotCapacities || {};

                const isExtended = rescheduleType === 'extended';
                const duration = isExtended ? (Number(rescheduleDuration) || 60) : (Number(activeWorkConfig.slotDuration) || 30);
                const tolerance = isExtended ? (Number(rescheduleTolerance) || 0) : 0;
                const totalSlotBlock = duration + tolerance;

                const daysOfWeek = activeWorkConfig.daysOfWeek || [];
                const specificDates = activeWorkConfig.specificDates || [];

                if (daysOfWeek.length === 0 && specificDates.length === 0) return [];

                const scheduleList = [];
                const today = new Date();

                for (let i = 0; i < 30; i++) {
                    const currentDate = new Date(today);
                    currentDate.setDate(today.getDate() + i);
                    const dayOfWeek = currentDate.getDay();
                    const year = currentDate.getFullYear();
                    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                    const dayNum = String(currentDate.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${dayNum}`;

                    const isDayOfWeekMatch = daysOfWeek.includes(dayOfWeek);
                    const isSpecificDateMatch = specificDates.includes(dateStr);

                    if (isDayOfWeekMatch || isSpecificDateMatch) {
                        let startT = activeWorkConfig.startTime || "08:00";
                        let endT = activeWorkConfig.endTime || "18:00";
                        if (dayOfWeek === 6 && activeWorkConfig.saturdayStartTime && activeWorkConfig.saturdayEndTime) {
                            startT = activeWorkConfig.saturdayStartTime;
                            endT = activeWorkConfig.saturdayEndTime;
                        } else if (dayOfWeek === 0 && activeWorkConfig.sundayStartTime && activeWorkConfig.sundayEndTime) {
                            startT = activeWorkConfig.sundayStartTime;
                            endT = activeWorkConfig.sundayEndTime;
                        }

                        const startMin = timeToMin(startT);
                        const endMin = timeToMin(endT);

                        // Confirmed appointments on this date
                        const dayApps = (appointments || []).filter(a => 
                            a.doctorId === (reschedulingApp.doctorId || loggedInId) &&
                            (!reschedulingApp.professionalId || a.professionalId === reschedulingApp.professionalId) &&
                            a.date === dateStr &&
                            a.status === 'confirmed' &&
                            a.id !== reschedulingApp.id
                        );

                        const availableSlots = [];

                        if (isExtended) {
                            const step = 15;
                            for (let t = startMin; t + totalSlotBlock <= endMin; t += step) {
                                const slotStart = t;
                                const slotEnd = t + totalSlotBlock;

                                let inBreak = false;
                                if (activeWorkConfig.breaks?.lunch?.active) {
                                    const lStart = timeToMin(activeWorkConfig.breaks.lunch.start || "12:00");
                                    const lEnd = timeToMin(activeWorkConfig.breaks.lunch.end || "13:30");
                                    if (!(slotEnd <= lStart || slotStart >= lEnd)) inBreak = true;
                                }
                                if (activeWorkConfig.breaks?.snack?.active) {
                                    const sStart = timeToMin(activeWorkConfig.breaks.snack.start || "16:00");
                                    const sEnd = timeToMin(activeWorkConfig.breaks.snack.end || "16:30");
                                    if (!(slotEnd <= sStart || slotStart >= sEnd)) inBreak = true;
                                }
                                if (inBreak) continue;

                                let hasOverlap = false;
                                for (const app of dayApps) {
                                    const aStart = timeToMin(app.time);
                                    const aDur = (Number(app.duration) || Number(activeWorkConfig.slotDuration) || 30) + (Number(app.tolerance) || 0);
                                    const aEnd = aStart + aDur;
                                    if (slotStart < aEnd && slotEnd > aStart) {
                                        hasOverlap = true;
                                        break;
                                    }
                                }

                                if (!hasOverlap) {
                                    availableSlots.push(minToTime(slotStart));
                                }
                            }
                        } else {
                            let currentMin = startMin;
                            const standardDur = Number(activeWorkConfig.slotDuration) || 30;
                            const standardInterval = Number(activeWorkConfig.minInterval) || 0;

                            while (currentMin + standardDur <= endMin) {
                                const slotStart = currentMin;
                                const slotEnd = currentMin + standardDur;
                                let inBreak = false;
                                if (activeWorkConfig.breaks?.lunch?.active) {
                                    const lStart = timeToMin(activeWorkConfig.breaks.lunch.start || "12:00");
                                    const lEnd = timeToMin(activeWorkConfig.breaks.lunch.end || "13:30");
                                    if (!(slotEnd <= lStart || slotStart >= lEnd)) inBreak = true;
                                }
                                if (activeWorkConfig.breaks?.snack?.active) {
                                    const sStart = timeToMin(activeWorkConfig.breaks.snack.start || "16:00");
                                    const sEnd = timeToMin(activeWorkConfig.breaks.snack.end || "16:30");
                                    if (!(slotEnd <= sStart || slotStart >= sEnd)) inBreak = true;
                                }

                                if (!inBreak) {
                                    const timeStr = minToTime(slotStart);
                                    let maxSlots = globalMax;
                                    if (capacities[timeStr] !== undefined) maxSlots = capacities[timeStr];
                                    const reversedRules = [...rules].reverse();
                                    const applicableRules = reversedRules.filter(r => r.times.includes(timeStr) || r.times.includes('all'));
                                    const dateRule = applicableRules.find(r => r.type === 'date' && r.date === dateStr);
                                    if (dateRule) maxSlots = dateRule.capacity;
                                    else {
                                        const daysRule = applicableRules.find(r => r.type === 'days' && r.days.includes(dayOfWeek));
                                        if (daysRule) maxSlots = daysRule.capacity;
                                        else {
                                            const allRule = applicableRules.find(r => r.type === 'all');
                                            if (allRule) maxSlots = allRule.capacity;
                                        }
                                    }

                                    const bookedCount = dayApps.filter(a => a.time === timeStr).length;
                                    if (bookedCount < maxSlots) {
                                        availableSlots.push(timeStr);
                                    }
                                }
                                currentMin += standardDur + standardInterval;
                            }
                        }

                        if (availableSlots.length > 0) {
                            const labels = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
                            const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
                            const label = `${labels[dayOfWeek]}, ${dayNum} ${months[currentDate.getMonth()]}`;
                            scheduleList.push({ date: dateStr, label, slots: availableSlots });
                        }
                    }
                }
                return scheduleList;
            }, [reschedulingApp, rescheduleType, rescheduleDuration, rescheduleTolerance, localDoctor, loggedInDoctor, loggedInProfessionalId, appointments, loggedInId]);

            // Auto-select first available date when schedule updates
            useEffect(() => {
                if (calculatedRescheduleSchedule && calculatedRescheduleSchedule.length > 0) {
                    if (!calculatedRescheduleSchedule.some(d => d.date === rescheduleSelectedDate)) {
                        const firstDay = calculatedRescheduleSchedule[0];
                        setRescheduleSelectedDate(firstDay.date);
                        setRescheduleSelectedTime(firstDay.slots[0] || '');
                    }
                } else {
                    setRescheduleSelectedDate('');
                    setRescheduleSelectedTime('');
                }
            }, [calculatedRescheduleSchedule, rescheduleSelectedDate]);

            // Auto-select valid time when selected date changes
            useEffect(() => {
                if (rescheduleSelectedDate && calculatedRescheduleSchedule && calculatedRescheduleSchedule.length > 0) {
                    const day = calculatedRescheduleSchedule.find(d => d.date === rescheduleSelectedDate);
                    if (day && day.slots.length > 0) {
                        if (!day.slots.includes(rescheduleSelectedTime)) {
                            setRescheduleSelectedTime(day.slots[0]);
                        }
                    } else {
                        setRescheduleSelectedTime('');
                    }
                }
            }, [rescheduleSelectedDate, calculatedRescheduleSchedule, rescheduleSelectedTime]);

                    const duration = isExtended ? Number(rescheduleDuration) : (Number(activeWorkConfig.slotDuration) || 30);

            const applyGrouping = async () => {
                if (!scheduleDoctor || !localDoctor) return;
                const target = scheduleDoctor;
                const newConfig = { ...target.workConfig };
                const currentRules = [...(newConfig.groupingRules || [])];
                
                let updatedMaxSlotsPerTime = target.maxSlotsPerTime || 1;

                // If 'all' is selected, it's one rule for all slots
                if (selectedGroupingTimes.includes('all')) {
                    const newRule = {
                        id: Math.random().toString(36).substr(2, 9),
                        times: ['all'],
                        capacity: groupingQty,
                        type: groupingRuleType,
                    };
                    if (groupingRuleType === 'date') newRule.date = groupingRuleDate;
                    if (groupingRuleType === 'days') newRule.days = [...groupingRuleDays];
                    
                    currentRules.push(newRule);
                    if (newRule.type === 'all') {
                        newConfig.maxSlotsPerTime = groupingQty;
                        updatedMaxSlotsPerTime = groupingQty;
                    }
                } else {
                    // Group times by their capacity to create fewer rules
                    const capacityGroups = {};
                    selectedGroupingTimes.forEach(time => {
                        const cap = tempQuantities[time] || groupingQty;
                        if (!capacityGroups[cap]) capacityGroups[cap] = [];
                        capacityGroups[cap].push(time);
                    });

                    Object.entries(capacityGroups).forEach(([cap, times]) => {

                            id: Math.random().toString(36).substr(2, 9),
                            times: times,
                            capacity: Number(cap),
                            type: groupingRuleType,

                        if (groupingRuleType === 'date') newRule.date = groupingRuleDate;
                        if (groupingRuleType === 'days') newRule.days = [...groupingRuleDays];
                        
                        currentRules.push(newRule);

                const interval = scheduleDoctor.workConfig.minInterval || 0;

            const isCompanyView = loggedInDoctor?.isClinic && !loggedInProfessionalId;
            const activeProfessional = loggedInProfessionalId 
                ? ((localDoctor?.professionals || []).find(p => p.id === loggedInProfessionalId) || (loggedInDoctor?.professionals || []).find(p => p.id === loggedInProfessionalId)) 
                : null;
            
            // For schedule tab editing: if isCompanyView and a specific professional is selected, edit that professional
            const isEditingSpecificProf = isCompanyView && editingProfessionalId && editingProfessionalId !== 'company';
            const selectedCompanyProf = isEditingSpecificProf 
                ? (localDoctor?.professionals || []).find(p => p.id === editingProfessionalId) 
                : null;
            
            // displayDoctor is used across general dashboard views
            const displayDoctor = activeProfessional || localDoctor || loggedInDoctor;
            // scheduleDoctor is specifically the target doctor being configured in the schedule settings tab
            const scheduleDoctor = isCompanyView 
                ? (selectedCompanyProf || localDoctor || loggedInDoctor)
                : displayDoctor;

            if (!loggedInDoctor || !localDoctor) return <div className="p-20 text-center font-black uppercase text-slate-900">Carregando painel...</div>;

            const handleAddProfessional = () => {
                if (!newProf.name || !localDoctor) return;
                const companyDays = localDoctor.workConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                const initialWorkConfig = JSON.parse(JSON.stringify(localDoctor.workConfig || DEFAULT_WORK_CONFIG));
                initialWorkConfig.daysOfWeek = [...companyDays];

                const prof = {
                    id: Math.random().toString(36).substr(2, 9),
                    name: newProf.name,
                    specialties: newProf.specialties.split(',').map(s => s.trim()),
                    image: newProf.image,
                    status: 'active',
                    workConfig: initialWorkConfig,
                    maxSlotsPerTime: 1,
                    slotCapacities: {}
                };
                // Generate initial schedule for the new professional
                prof.schedule = generateScheduleFromConfig(prof.workConfig);
                
                setLocalDoctor(prev => prev ? ({ ...prev, professionals: [...(prev.professionals || []), prof] }) : null);
                setNewProf({ name: '', specialties: '', image: '' });
                showNotification("Profissional adicionado. Lembre-se de clicar em SALVAR ALTERAÇÕES no final da página.");
            };

            const handleDeleteProfessional = (id) => {
                if (!localDoctor) return;
                showConfirmation("Deseja excluir este profissional?", () => {
                    setLocalDoctor(prev => prev ? ({ ...prev, professionals: (prev.professionals || []).filter(p => p.id !== id) }) : null);
                });
            };

            const handleUpdateProfessional = async (id, updates) => {
                if (!localDoctor) return;
                const updatedProfessionals = (localDoctor.professionals || []).map(p => p.id === id ? { ...p, ...updates } : p);
                const updatedDoctor = { ...localDoctor, professionals: updatedProfessionals };
                setLocalDoctor(updatedDoctor);
                try {
                    const { id: docId, ...dataUpdates } = updatedDoctor;
                    await setDoctors(docId, dataUpdates);
                } catch (err) {
                    console.error("Erro ao atualizar profissional:", err);
                }
            };

            const renderAppointmentCards = (appsList) => {
                const visibleApps = (appsList || []).filter(a => a && !a.rescheduledToId && a.status !== 'rescheduled');
                const activeApps = visibleApps.filter(a => a.status !== 'cancelled');
                const cancelledApps = visibleApps.filter(a => a.status === 'cancelled');

                const renderGrouped = (list) => {
                    const grouped = list.reduce((acc, app) => {
                        const key = `${formatDateLong(app.date)} | ${app.time}`;
                        if (!acc[key]) acc[key] = [];
                        acc[key].push(app);
                        return acc;
                    }, {});

                    return Object.entries(grouped)
                        .sort((a, b) => a[0].localeCompare(b[0]))
                        .map(([slotKey, apps]) => (
                            <div key={slotKey} className="border border-slate-200 bg-white overflow-hidden shadow-sm hover:border-red-600 transition-all">
                                <div className="bg-slate-50 border-b border-slate-200 px-4 py-2 flex justify-between items-center">
                                    <h4 className="text-slate-900 font-black text-[11px] uppercase tracking-wider">
                                        <i className="fas fa-clock mr-1.5 text-red-600"></i> {slotKey}
                                    </h4>
                                    <span className="text-[10px] font-black text-slate-700 uppercase bg-white px-2 py-0.5 border border-slate-200">{apps.length} PACIENTE(S)</span>
                                </div>
                                <div className="divide-y divide-slate-100">
                                    {apps.map(app => (
                                        <div key={app.id} className={`px-4 py-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 transition-all ${app.status === 'cancelled' ? 'opacity-60 bg-slate-50' : (app.status === 'completed' ? 'bg-emerald-50/25 border-l-4 border-emerald-600' : 'bg-white hover:bg-slate-50/40')}`}>
                                            <div className="flex gap-3 items-center w-full md:w-auto flex-1 min-w-0">
                                                <div className={`px-2.5 py-1.5 flex flex-col items-center justify-center font-black shrink-0 min-w-[56px] ${app.status === 'cancelled' ? 'bg-slate-200 text-slate-900' : (app.status === 'completed' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-red-600 text-white shadow-sm')}`}>
                                                    <span className="text-[14px] leading-tight">{app.time}</span>
                                                    {app.duration && app.isExtendedTime && (
                                                        <span className="text-[7px] font-black uppercase tracking-tighter opacity-90">{app.duration}M</span>
                                                    )}
                                                </div>
                                                <div className="min-w-0 flex-1">
                                                    <div className="flex items-center gap-2 flex-wrap">
                                                        <p className="font-black uppercase text-slate-900 text-sm leading-tight">{app.patientName}</p>
                                                        {(app.isRescheduled || app.rescheduledFromId || app.rescheduled) && (
                                                            <span className="px-2 py-0.5 bg-amber-500 text-white text-[8px] font-black uppercase rounded border border-amber-600 flex items-center gap-1 shadow-sm">
                                                                <i className="fas fa-history"></i> Reagendamento
                                                            </span>
                                                        )}
                                                        {app.status === 'completed' && (
                                                            <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[8px] font-black uppercase rounded border border-emerald-300 flex items-center gap-1">
                                                                <i className="fas fa-check-circle text-emerald-600"></i> CONCLUÍDA
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 mt-0.5 text-[10px] font-bold text-slate-700 uppercase">
                                                        <span>CPF: <strong className="text-slate-900">{app.patientCPF}</strong></span>
                                                        <span>•</span>
                                                        <span>Tel: <strong className="text-slate-900">{app.patientPhone}</strong></span>
                                                        {isCompanyView && (
                                                            <>
                                                                <span>•</span>
                                                                <span className="text-red-600 font-black">
                                                                    <i className="fas fa-user-md mr-1"></i>
                                                                    Prof: {(localDoctor?.professionals || []).find(p => p.id === app.professionalId)?.name || 'Clínica'}
                                                                </span>
                                                            </>
                                                        )}
                                                    </div>
                                                    
                                                    {((app.isRescheduled || app.rescheduledFromId || app.rescheduled) && app.rescheduledFromDate) && (
                                                        <p className="text-[9px] font-black text-amber-700 uppercase mt-0.5 flex items-center gap-1">
                                                            <i className="fas fa-sync-alt text-amber-600"></i>
                                                            Anterior: {formatDateLong(app.rescheduledFromDate)} às {app.rescheduledFromTime || ''}
                                                        </p>
                                                    )}
                                                    {app.document && (
                                                        <p className="text-[9px] font-bold text-emerald-700 uppercase mt-0.5 flex items-center gap-1">
                                                            <i className="fas fa-file-alt text-emerald-600"></i>
                                                            Doc: <a href={app.document.data} download={app.document.name} target="_blank" rel="noopener noreferrer" className="underline font-black hover:text-emerald-900">{app.document.name}</a>
                                                        </p>
                                                    )}
                                                    {app.notes && (
                                                        <p className="text-[9px] font-bold text-slate-600 uppercase mt-0.5 flex items-center gap-1">
                                                            <i className="fas fa-sticky-note text-amber-500"></i>
                                                            Notas: {app.notes}
                                                        </p>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap shrink-0">
                                                {app.status === 'cancelled' ? (
                                                    <button 
                                                        onClick={() => handleStartReschedule(app)} 
                                                        className="px-3.5 py-1.5 bg-red-600 text-white text-[10px] font-black uppercase hover:bg-red-700 transition-colors active-scale flex items-center gap-1.5 shadow-sm"
                                                    >
                                                        <i className="fas fa-calendar-alt"></i> REAGENDAR
                                                    </button>
                                                ) : app.status === 'completed' ? (
                                                    <div className="flex items-center gap-2">
                                                        <button 
                                                            onClick={() => handleStartReschedule(app)} 
                                                            className="px-3.5 py-1.5 bg-red-600 text-white text-[10px] font-black uppercase hover:bg-red-700 transition-all active-scale flex items-center gap-1.5 shadow-sm"
                                                        >
                                                            <i className="fas fa-calendar-alt"></i> REAGENDAR
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <button 
                                                            onClick={async () => {
                                                                await onUpdateAppointment(app.id, { status: 'completed' });
                                                                showNotification('Consulta marcada como CONCLUÍDA!');
                                                            }}
                                                            className="px-3 py-1.5 bg-emerald-600 text-white text-[10px] font-black uppercase hover:bg-emerald-700 transition-all flex items-center gap-1 shadow-sm active-scale"
                                                            title="Marcar consulta como concluída"
                                                        >
                                                            <i className="fas fa-check"></i> CONCLUÍDO
                                                        </button>
                                                        <div className="relative">
                                                            <input 
                                                                type="file" 
                                                                id={`file-${app.id}`} 
                                                                className="hidden" 
                                                                onChange={async (e) => {
                                                                    const file = e.target.files[0];
                                                                    if (file) {
                                                                        const reader = new FileReader();
                                                                        reader.onload = async (event) => {
                                                                            await onUpdateAppointment(app.id, { 
                                                                                document: { 
                                                                                    name: file.name, 
                                                                                    data: event.target.result 
                                                                                } 
                                                                            });
                                                                            showNotification('Documento anexado com sucesso!');
                                                                        };
                                                                        reader.readAsDataURL(file);
                                                                    }
                                                                }} 
                                                            />
                                                            <label 
                                                                htmlFor={`file-${app.id}`} 
                                                                className="px-3 py-1.5 bg-slate-100 text-slate-900 text-[10px] font-black uppercase cursor-pointer hover:bg-red-600 hover:text-white transition-all flex items-center gap-1.5 border border-slate-200"
                                                            >
                                                                <i className="fas fa-paperclip"></i> {app.document ? 'ALTERAR DOC' : 'ANEXAR DOC'}
                                                            </label>
                                                        </div>
                                                        <button onClick={() => onCancelAppointment(app.id)} className="px-3.5 py-1.5 border border-red-600 text-red-600 text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition-colors active-scale">
                                                            CANCELAR
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ));

                return (
                    <div className="space-y-6">
                        {activeApps.length > 0 ? (
                            <div className="grid grid-cols-1 gap-3">
                                {renderGrouped(activeApps)}
                            </div>
                        ) : (
                            <p className="py-8 text-center text-xs font-black text-slate-900 uppercase italic bg-slate-50 border border-dashed border-slate-200">Nenhum agendamento ativo.</p>
                        )}
                        
                        {cancelledApps.length > 0 && (
                            <div className="space-y-4 pt-4 border-t-2 border-slate-300">
                                <div className="flex items-center gap-4">
                                    <div className="h-0.5 bg-slate-300 flex-grow"></div>
                                    <span className="text-xs font-black text-red-600 uppercase tracking-[0.2em] bg-red-50 px-3 py-1 border border-red-200 flex items-center gap-2 shadow-sm">
                                        <i className="fas fa-ban"></i>
                                        Agendamentos Cancelados ({cancelledApps.length})
                                    </span>
                                    <div className="h-0.5 bg-slate-300 flex-grow"></div>
                                </div>
                                <div className="grid grid-cols-1 gap-3 opacity-75">
                                    {renderGrouped(cancelledApps)}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const mySupportMessages = (supportMessages || []).filter(m => {
                if (!m) return false;
                const isDocMatch = m.doctorId === loggedInId || m.doctorId === displayDoctor?.id;
                if (!isDocMatch) return false;

                if (loggedInProfessionalId) {
                    return m.professionalId === loggedInProfessionalId || m.doctorId === loggedInProfessionalId;
                } else {
                    return !m.professionalId || m.doctorId === loggedInId;
                }
            });

            if (reschedulingApp) {
                return (
                    <div className="lg:max-w-none mx-auto animate-slide-up px-4 lg:px-0 space-y-8 my-6">
                        {/* Page Top Header Bar */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 border border-slate-200 border-b-4 border-red-600 shadow-xl">
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setReschedulingApp(null)}
                                    className="px-4 py-2.5 bg-slate-900 hover:bg-black text-white font-black uppercase text-xs tracking-widest flex items-center gap-2 transition-all shadow-md active-scale shrink-0"
                                >
                                    <i className="fas fa-arrow-left"></i> VOLTAR AO PAINEL
                                </button>
                                <div>
                                    <span className="text-[9px] font-black text-red-600 uppercase tracking-widest block">ASSISTENTE DE REAGENDAMENTO</span>
                                    <h2 className="text-xl sm:text-2xl font-black uppercase tracking-tight text-slate-900">
                                        Reagendar Consulta
                                    </h2>
                                </div>
                            </div>
                            <div className="text-left sm:text-right">
                                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Profissional / Clínica</span>
                                <span className="text-xs font-black uppercase text-slate-900">{displayDoctor?.name}</span>
                            </div>
                        </div>

                        {/* Page Content Card */}
                        <div className="bg-white border-2 border-slate-200 p-6 md:p-10 shadow-2xl space-y-8">
                            {/* Patient Info Header */}
                            <div className="bg-slate-50 p-5 border border-slate-200 rounded space-y-2 text-xs">
                                <div className="flex flex-wrap justify-between items-center gap-2">
                                    <p className="font-black uppercase text-slate-900 text-sm">
                                        <i className="fas fa-user-circle text-red-600 mr-2 text-base"></i>
                                        Paciente: {reschedulingApp.patientName}
                                    </p>
                                    {reschedulingApp.patientPhone && (
                                        <span className="text-[11px] font-bold text-slate-700 uppercase bg-white px-3 py-1 border border-slate-200 rounded">
                                            <i className="fas fa-phone-alt mr-1 text-red-600"></i> {reschedulingApp.patientPhone}
                                        </span>
                                    )}
                                </div>
                                <div className="flex flex-wrap gap-4 pt-1 text-slate-600 font-bold uppercase text-[11px]">
                                    <span>CPF: <strong className="text-slate-900">{reschedulingApp.patientCPF || 'N/A'}</strong></span>
                                    <span>•</span>
                                    <span className="text-red-600">
                                        <i className="fas fa-history mr-1"></i> Data Anterior: <strong>{formatDateLong(reschedulingApp.date)} às {reschedulingApp.time}</strong>
                                    </span>
                                </div>
                            </div>

                            {/* Question: Standard vs Extended Time */}
                            <div className="bg-slate-50 p-6 border-2 border-slate-200 rounded space-y-4">
                                <div className="flex items-start gap-3">
                                    <div className="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0 mt-0.5">
                                        <i className="fas fa-question text-sm font-black"></i>
                                    </div>
                                    <div>
                                        <h4 className="text-xs sm:text-sm font-black uppercase text-slate-900 tracking-wide">
                                            Esse reagendamento vai seguir um horário padrão ou vai ser em tempo maior?
                                        </h4>
                                        <p className="text-[11px] font-bold text-slate-500 uppercase mt-0.5">
                                            Selecione uma das opções abaixo para calcular os dias e horários disponíveis na agenda:
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setRescheduleType('standard')}
                                        className={`p-5 border-2 font-black uppercase text-xs transition-all flex flex-col items-center justify-center gap-1.5 text-center rounded ${rescheduleType === 'standard' ? 'border-red-600 bg-red-50 text-red-700 shadow-md ring-2 ring-red-600' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-400'}`}
                                    >
                                        <div className="flex items-center gap-2 text-sm">
                                            <i className="fas fa-clock text-red-600"></i>
                                            <span>NÃO (HORÁRIO PADRÃO)</span>
                                        </div>
                                        <span className="text-[10px] font-bold text-slate-500">Duração padrão da clínica/profissional</span>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setRescheduleType('extended')}
                                        className={`p-5 border-2 font-black uppercase text-xs transition-all flex flex-col items-center justify-center gap-1.5 text-center rounded ${rescheduleType === 'extended' ? 'border-red-600 bg-red-50 text-red-700 shadow-md ring-2 ring-red-600' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-400'}`}
                                    >
                                        <div className="flex items-center gap-2 text-sm">
                                            <i className="fas fa-hourglass-half text-red-600"></i>
                                            <span>SIM (TEMPO MAIOR)</span>
                                        </div>
                                        <span className="text-[10px] font-bold text-slate-500">Duração customizada + tolerância</span>
                                    </button>
                                </div>
                            </div>

                            {/* Extended Time Duration & Tolerance Configuration */}
                            {rescheduleType === 'extended' && (
                                <div className="p-6 bg-amber-50/60 border border-amber-200 rounded space-y-4 animate-slide-up">
                                    <h5 className="text-xs font-black uppercase text-amber-900 tracking-wider flex items-center gap-2">
                                        <i className="fas fa-stopwatch text-amber-600"></i>
                                        Configuração de Duração e Tolerância
                                    </h5>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-900 block">
                                                Duração da Consulta (minutos)
                                            </label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="number"
                                                    min="15"
                                                    max="300"
                                                    step="5"
                                                    className="w-full p-3 border border-slate-200 font-black text-xs uppercase bg-white focus:border-red-600 outline-none rounded"
                                                    value={rescheduleDuration}
                                                    onChange={(e) => setRescheduleDuration(Number(e.target.value) || 15)}
                                                />
                                                <div className="flex gap-1 shrink-0">
                                                    {[45, 60, 90, 120].map(dur => (
                                                        <button
                                                            key={dur}
                                                            type="button"
                                                            onClick={() => setRescheduleDuration(dur)}
                                                            className={`px-2.5 py-1 text-[10px] font-black uppercase rounded border transition-all ${rescheduleDuration === dur ? 'bg-red-600 text-white border-red-600' : 'bg-white text-slate-700 border-slate-200 hover:border-slate-400'}`}
                                                        >
                                                            {dur}m
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                                        onClick={() => {

                                                        className={`px-5 py-3.5 border-2 text-left shrink-0 transition-all rounded ${rescheduleSelectedDate === day.date ? 'border-red-600 bg-red-600 text-white shadow-lg ring-2 ring-red-600' : 'border-slate-200 bg-white text-slate-800 hover:border-slate-400'}`}
                                                    >
                                                        <p className="text-[10px] font-black uppercase">{day.label.split(',')[0]}</p>
                                                        <p className="text-xs font-black uppercase">{day.label.split(',')[1] || day.date}</p>
                                                        <p className={`text-[9px] font-bold uppercase mt-1 ${rescheduleSelectedDate === day.date ? 'text-red-100' : 'text-slate-500'}`}>{day.slots.length} horário(s)</p>
