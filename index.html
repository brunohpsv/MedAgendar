        const AdminDashboard = ({ doctors, setDoctors, onDeleteDoctor, appointments = [], onUpdateAppointment, supportMessages = [], onSendSupportMessage, isAuthenticated, onAuthenticate, showNotification, showConfirmation }) => {
            const [password, setPassword] = useState('');
            const [showShareModal, setShowShareModal] = useState(null); // null = none, 'main' = company, doctorId = specific doctor
            const [statusFilter, setStatusFilter] = useState('all'); // 'all', 'active', 'suspended', 'pending'
            const [adminTab, setAdminTab] = useState('partners'); // 'partners', 'reports', 'attachments', 'chat'
            const [selectedChatDoctorId, setSelectedChatDoctorId] = useState(null);
            const [adminChatInput, setAdminChatInput] = useState('');
            const [editingPasswords, setEditingPasswords] = useState({});
            const [showPasswords, setShowPasswords] = useState({});

            // Report Filters State
            const [reportDoctorFilter, setReportDoctorFilter] = useState('all');
            const [reportCategoryFilter, setReportCategoryFilter] = useState('all');
            const [reportPeriodFilter, setReportPeriodFilter] = useState('all');
            const [reportSearchQuery, setReportSearchQuery] = useState('');
            
            const toggleStatus = (id, currentStatus) => { 
                let newStatus = 'active';
                if (currentStatus === 'active') {
                    newStatus = 'suspended';
                } else if (currentStatus === 'pending') {
                    newStatus = 'active';
                } else if (currentStatus === 'suspended') {
                    newStatus = 'active';
                }
                setDoctors(id, { status: newStatus }); 
                if (currentStatus === 'pending') {
                    showNotification("Acesso liberado com sucesso! O profissional agora está visível no site.");
                } else if (newStatus === 'suspended') {
                    showNotification("Perfil suspenso.");
                } else {
                    showNotification("Perfil ativado com sucesso!");
                }
            };

            const pendingCount = (doctors || []).filter(d => d.status === 'pending').length;
            const activeCount = (doctors || []).filter(d => d.status === 'active').length;
            const suspendedCount = (doctors || []).filter(d => d.status === 'suspended').length;

            const filteredDoctors = (doctors || []).filter(doc => {
                if (!doc || !doc.name) return false;
                if (statusFilter === 'all') return true;
                return doc.status === statusFilter;
            });

            // Gather all attachments from appointments and doctors
            const appointmentAttachments = (appointments || []).filter(app => app && app.document && app.document.name);
            const doctorImageAttachments = (doctors || []).filter(doc => doc && doc.image && String(doc.image).startsWith('data:'));
            const totalAttachmentsCount = appointmentAttachments.length + doctorImageAttachments.length;

            // --- COMPREHENSIVE AUDIT & MOVEMENTS AGGREGATION ---
            const allMovements = useMemo(() => {
                const list = [];

                // 1. Cadastros de Médicos e Clínicas
                (doctors || []).forEach(doc => {
                    if (!doc) return;
                    list.push({
                        id: `doc-create-${doc.id}`,
                        type: 'DOCTOR_SIGNUP',
                        category: 'cadastros',
                        typeLabel: 'CADASTRO DE PARCEIRO',
                        icon: doc.isClinic ? 'fa-building' : 'fa-user-md',
                        color: doc.isClinic ? 'bg-indigo-600 text-white' : 'bg-blue-600 text-white',
                        badgeBg: doc.isClinic ? 'bg-indigo-100 text-indigo-800 border-indigo-200' : 'bg-blue-100 text-blue-800 border-blue-200',
                        timestamp: doc.createdAt || '2026-01-01T00:00:00.000Z',
                        actorName: doc.name,
                        actorType: doc.isClinic ? 'Pessoa Jurídica (Clínica)' : 'Pessoa Física',
                        doctorId: doc.id,
                        doctorName: doc.name,
                        details: {
                            name: doc.name,
                            type: doc.isClinic ? 'Pessoa Jurídica (Clínica)' : 'Pessoa Física',
                            email: doc.email || 'Não informado',
                            identifier: doc.isClinic ? `CNPJ: ${doc.cnpj || 'N/A'}` : `CRM: ${doc.crm || 'N/A'}`,
                            city: doc.city ? `${doc.city} - ${doc.state || ''}` : 'Não informada',
                            address: doc.address || '',
                            specialties: Array.isArray(doc.specialties) ? doc.specialties.join(', ') : (doc.specialties || ''),
                            status: doc.status || 'active',
                            accessCode: doc.accessCode || 'NÃO DEFINIDA',
                            price: doc.price ? `R$ ${doc.price}` : 'Não informado',
                            professionalsCount: (doc.professionals || []).length
                        }
                    });

                    // 2. Profissionais cadastrados dentro de Clínicas PJ
                    (doc.professionals || []).forEach(prof => {
                        list.push({
                            id: `prof-create-${doc.id}-${prof.id}`,
                            type: 'PROFESSIONAL_ADDED',
                            category: 'cadastros',
                            typeLabel: 'PROFISSIONAL VINCULADO',
                            icon: 'fa-user-plus',
                            color: 'bg-cyan-600 text-white',
                            badgeBg: 'bg-cyan-100 text-cyan-800 border-cyan-200',
                            timestamp: prof.createdAt || doc.createdAt || '2026-01-01T00:00:00.000Z',
                            actorName: prof.name,
                            actorType: `Profissional da Clínica ${doc.name}`,
                            doctorId: doc.id,
                            doctorName: doc.name,
                            professionalId: prof.id,
                            professionalName: prof.name,
                            details: {
                                name: prof.name,
                                clinicName: doc.name,
                                specialties: Array.isArray(prof.specialties) ? prof.specialties.join(', ') : (prof.specialties || ''),
                                status: prof.status || 'active',
                                workDays: prof.workConfig?.daysOfWeek?.length ? `${prof.workConfig.daysOfWeek.length} dias configurados` : 'Padrão da clínica'
                            }
                        });
                    });
                });

                // 3. Agendamentos (Novos, Concluídos, Reagendados, Cancelados)
                (appointments || []).forEach(app => {
                    if (!app) return;
                    const targetDoctor = (doctors || []).find(d => d.id === app.doctorId);
                    const profName = app.professionalName || (targetDoctor?.professionals || []).find(p => p.id === app.professionalId)?.name;
                    
                    let type = 'APPOINTMENT_CREATED';
                    let typeLabel = 'NOVO AGENDAMENTO';
                    let category = 'agendamentos';
                    let icon = 'fa-calendar-plus';
                    let color = 'bg-emerald-600 text-white';
                    let badgeBg = 'bg-emerald-100 text-emerald-800 border-emerald-200';

                    if (app.status === 'cancelled') {
                        type = 'APPOINTMENT_CANCELLED';
                        typeLabel = 'AGENDAMENTO CANCELADO';
                        category = 'cancelamentos';
                        icon = 'fa-calendar-times';
                        color = 'bg-red-600 text-white';
                        badgeBg = 'bg-red-100 text-red-800 border-red-200';
                    } else if (app.status === 'completed') {
                        type = 'APPOINTMENT_COMPLETED';
                        typeLabel = 'CONSULTA CONCLUÍDA';
                        category = 'concluidos';
                        icon = 'fa-check-double';
                        color = 'bg-emerald-700 text-white';
                        badgeBg = 'bg-emerald-100 text-emerald-900 border-emerald-300';
                    } else if (app.isRescheduled || app.rescheduledFromId || app.rescheduled || app.status === 'rescheduled') {
                        type = 'APPOINTMENT_RESCHEDULED';
                        typeLabel = 'REAGENDAMENTO';
                        category = 'reagendamentos';
                        icon = 'fa-sync-alt';
                        color = 'bg-amber-600 text-white';
                        badgeBg = 'bg-amber-100 text-amber-900 border-amber-300';
                    }

                    list.push({
                        id: `app-${app.id}`,
                        type,
                        typeLabel,
                        category,
                        icon,
                        color,
                        badgeBg,
                        timestamp: app.createdAt || (app.date ? `${app.date}T${app.time || '00:00'}:00.000Z` : '2026-01-01T00:00:00.000Z'),
                        actorName: app.patientName,
                        actorType: 'Paciente',
                        doctorId: app.doctorId,
                        doctorName: targetDoctor?.name || app.doctorName || 'Profissional',
                        professionalId: app.professionalId,
                        professionalName: profName,
                        details: {
                            id: app.id,
                            patientName: app.patientName,
                            patientCPF: app.patientCPF,
                            patientPhone: app.patientPhone,
                            patientEmail: app.patientEmail || '',
                            date: app.date,
                            time: app.time,
                            duration: app.duration ? `${app.duration} minutos` : 'Padrão',
                            status: app.status,
                            price: app.price ? `R$ ${app.price}` : '',
                            notes: app.notes || '',
                            document: app.document ? app.document.name : null,
                            documentData: app.document ? app.document.data : null,
                            rescheduledFromDate: app.rescheduledFromDate,
                            rescheduledFromTime: app.rescheduledFromTime,
                            isExtendedTime: app.isExtendedTime
                        }
                    });

                    // 4. Anexos enviados na consulta
                    if (app.document && app.document.name) {
                        list.push({
                            id: `doc-attach-${app.id}`,
                            type: 'ATTACHMENT_UPLOADED',
                            typeLabel: 'DOCUMENTO ANEXADO',
                            category: 'anexos',
                            icon: 'fa-paperclip',
                            color: 'bg-purple-600 text-white',
                            badgeBg: 'bg-purple-100 text-purple-800 border-purple-200',
                            timestamp: app.createdAt || (app.date ? `${app.date}T${app.time || '00:00'}:00.000Z` : '2026-01-01T00:00:00.000Z'),
                            actorName: app.patientName,
                            actorType: 'Paciente / Consulta',
                            doctorId: app.doctorId,
                            doctorName: targetDoctor?.name || app.doctorName || 'Profissional',
                            professionalId: app.professionalId,
                            professionalName: profName,
                            details: {
                                docName: app.document.name,
                                docData: app.document.data,
                                patientName: app.patientName,
                                patientCPF: app.patientCPF,
                                appointmentDate: app.date,
                                appointmentTime: app.time
                            }
                        });
                    }
                });

                // 5. Mensagens de Suporte / Chat
                (supportMessages || []).forEach(msg => {
                    if (!msg) return;
                    const targetDoctor = (doctors || []).find(d => d.id === msg.doctorId);
                    list.push({
                        id: `msg-${msg.id}`,
                        type: 'SUPPORT_MESSAGE',
                        typeLabel: msg.senderType === 'admin' ? 'MENSAGEM DO ADMIN' : 'MENSAGEM DO PARCEIRO',
                        category: 'suporte',
                        icon: 'fa-comment-dots',
                        color: msg.senderType === 'admin' ? 'bg-slate-900 text-white' : 'bg-emerald-600 text-white',
                        badgeBg: msg.senderType === 'admin' ? 'bg-slate-100 text-slate-800 border-slate-300' : 'bg-emerald-100 text-emerald-800 border-emerald-200',
                        timestamp: msg.createdAt || '2026-01-01T00:00:00.000Z',
                        actorName: msg.senderType === 'admin' ? 'Administrador' : (msg.doctorName || targetDoctor?.name || 'Profissional'),
                        actorType: msg.senderType === 'admin' ? 'Suporte Admin' : 'Profissional / Clínica',
                        doctorId: msg.doctorId,
                        doctorName: targetDoctor?.name || msg.doctorName || 'Profissional',
                        professionalId: msg.professionalId,
                        details: {
                            text: msg.text,
                            senderType: msg.senderType,
                            doctorName: targetDoctor?.name || msg.doctorName || 'Profissional'
                        }
                    });
                });

                return list.sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
            }, [doctors, appointments, supportMessages]);

            // Filtered Movements for Report
            const filteredMovements = useMemo(() => {
                const now = new Date();
                return allMovements.filter(m => {
                    // Filter by Doctor / Partner
                    if (reportDoctorFilter !== 'all' && m.doctorId !== reportDoctorFilter) {
                        return false;
                    }

                    // Filter by Category
                    if (reportCategoryFilter !== 'all' && m.category !== reportCategoryFilter) {
                        return false;
                    }

                    // Filter by Period
                    if (reportPeriodFilter === 'today') {
                        const mDate = new Date(m.timestamp);
                        const isToday = mDate.getFullYear() === now.getFullYear() &&
                                        mDate.getMonth() === now.getMonth() &&
                                        mDate.getDate() === now.getDate();
                        if (!isToday) return false;
                    } else if (reportPeriodFilter === '7days') {
                        const mDate = new Date(m.timestamp);
                        const diffTime = Math.abs(now.getTime() - mDate.getTime());
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays > 7) return false;
                    } else if (reportPeriodFilter === '30days') {
                        const mDate = new Date(m.timestamp);
                        const diffTime = Math.abs(now.getTime() - mDate.getTime());
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays > 30) return false;
                    }

                    // Filter by search query
                    if (reportSearchQuery.trim()) {
                        const query = reportSearchQuery.toLowerCase();
                        const matchActor = (m.actorName || '').toLowerCase().includes(query);
                        const matchDoctor = (m.doctorName || '').toLowerCase().includes(query);
                        const matchType = (m.typeLabel || '').toLowerCase().includes(query);
                        const matchPatient = (m.details?.patientName || '').toLowerCase().includes(query);
                        const matchCPF = (m.details?.patientCPF || '').toLowerCase().includes(query);
                        const matchPhone = (m.details?.patientPhone || '').toLowerCase().includes(query);

                                                    <div className="flex items-start gap-3 flex-1 min-w-0">
                                                        <div className={`w-10 h-10 rounded shrink-0 flex items-center justify-center text-sm ${mov.color} shadow-sm`}>
                                                            <i className={`fas ${mov.icon}`}></i>
                                                        </div>

                                                        <div className="min-w-0 flex-1">
                                                            <div className="flex items-center gap-2 flex-wrap mb-1">
                                                                <span className={`px-2 py-0.5 text-[9px] font-black uppercase rounded border ${mov.badgeBg}`}>
                                                                    {mov.typeLabel}
                                                                </span>
                                                                <span className="text-[10px] font-black text-slate-500 uppercase">
                                                                    <i className="fas fa-clock mr-1"></i> {formattedDate} {formattedTime && `às ${formattedTime}`}
                                                                </span>
                                                            </div>

                                                            {/* Título da Ação e Ator */}
                                                            <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs font-black text-slate-900 uppercase">
                                                                <span>{mov.actorName}</span>
                                                                <span className="text-slate-400 font-normal">({mov.actorType})</span>
                                                                {mov.doctorName && mov.doctorName !== mov.actorName && (
                                                                    <>
                                                                        <span className="text-slate-300">•</span>
                                                                        <span className="text-red-600 font-bold">
                                                                            <i className="fas fa-clinic-medical mr-1"></i> {mov.doctorName}
                                                                        </span>
                                                                    </>
                                                                )}
                                                                {mov.professionalName && (
                                                                    <>
                                                                        <span className="text-slate-300">•</span>
                                                                        <span className="text-cyan-700 font-bold">
                                                                            <i className="fas fa-user-md mr-1"></i> Prof: {mov.professionalName}
                                                                        </span>
                                                                    </>
                                                                )}
                                                            </div>

                                                            {/* Detalhes Específicos por Tipo */}
                                                            <div className="mt-1 text-[11px] font-bold text-slate-600 space-y-0.5">
                                                                {/* Agendamentos */}
                                                                {mov.details?.patientCPF && (
                                                                    <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-slate-700">
                                                                        <span>CPF: <strong className="text-slate-900">{mov.details.patientCPF}</strong></span>
                                                                        <span>•</span>
                                                                        <span>Tel: <strong className="text-slate-900">{mov.details.patientPhone || 'N/A'}</strong></span>
                                                                        {mov.details.date && (
                                                                            <>
                                                                                <span>•</span>
                                                                                <span>Consulta: <strong className="text-slate-900">{formatDateLong(mov.details.date)} às {mov.details.time || ''}</strong></span>
                                                                            </>
                                                                        )}
                                                                        {mov.details.duration && (
                                                                            <span>({mov.details.duration})</span>
                                                                        )}
                                                                    </div>
                                                                )}

                                                                {/* Informação de Reagendamento */}
                                                                {mov.details?.rescheduledFromDate && (
                                                                    <p className="text-amber-700 font-black text-[10px] uppercase">
                                                                        <i className="fas fa-history mr-1"></i>
                                                                        Data Anterior: {formatDateLong(mov.details.rescheduledFromDate)} às {mov.details.rescheduledFromTime || ''}
                                                                    </p>
                                                                )}

                                                                {/* Cadastros de Parceiros */}
                                                                {mov.details?.identifier && (
                                                                    <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-slate-700">
                                                                        <span><strong>{mov.details.identifier}</strong></span>
                                                                        <span>•</span>
                                                                        <span>E-mail: {mov.details.email}</span>
                                                                        <span>•</span>
                                                                        <span>{mov.details.city}</span>
                                                                        <span>•</span>
                                                                        <span>Senha: <strong className="text-slate-900 font-mono">{mov.details.accessCode}</strong></span>
                                                                    </div>
                                                                )}

                                                                {/* Anexos */}
                                                                {mov.details?.docName && (
                                                                    <p className="text-purple-700 font-black text-[10px] uppercase flex items-center gap-1">
                                                                        <i className="fas fa-file-download text-purple-600"></i>
                                                                        Arquivo: <a href={mov.details.docData} download={mov.details.docName} target="_blank" rel="noopener noreferrer" className="underline hover:text-purple-900">{mov.details.docName}</a>
                                                                    </p>
                                                                )}

                                                                {/* Mensagens de Suporte */}
                                                                {mov.details?.text && (
                                                                    <p className="text-slate-800 bg-slate-50 p-2 border border-slate-200 mt-1 italic text-[11px]">
                                                                        "{mov.details.text}"
                                                                    </p>
                                                                )}

                                                                {/* Notas Gerais */}
                                                                {mov.details?.notes && (
                                                                    <p className="text-slate-500 text-[10px] uppercase">
                                                                        <i className="fas fa-sticky-note text-amber-500 mr-1"></i>
                                                                        Notas: {mov.details.notes}
                                                                    </p>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Lado Direito: Ações Rápidas */}
                                                    <div className="flex items-center gap-2 shrink-0 self-end md:self-center">
                                                        {mov.doctorId && (
                                                            <button 
                                                                onClick={() => setReportDoctorFilter(mov.doctorId)}
                                                                className="px-2.5 py-1 bg-slate-100 hover:bg-slate-900 hover:text-white text-slate-800 text-[10px] font-black uppercase transition-all border border-slate-200"
                                                                title="Filtrar todas as ações deste parceiro"
                                                            >
                                                                <i className="fas fa-user mr-1"></i> VER PERFIL
                                                            </button>
                                                        )}
                                                        {mov.details?.docData && (
                                                            <a 
                                                                href={mov.details.docData} 
                                                                download={mov.details.docName || 'documento'} 
                                                                target="_blank" 
                                                                rel="noopener noreferrer"
                                                                className="px-2.5 py-1 bg-purple-50 text-purple-700 hover:bg-purple-600 hover:text-white text-[10px] font-black uppercase transition-all border border-purple-200 flex items-center gap-1"
                                                            >
                                                                <i className="fas fa-download"></i> BAIXAR DOC
                                                            </a>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal de Compartilhamento */}
                    {showShareModal && (
                        <div className="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-2xl border-4 border-slate-200 animate-slide-up overflow-hidden">
                                <div className="bg-white border-b border-slate-200 p-6 flex justify-between items-center text-slate-900">
                                    <h3 className="font-black uppercase tracking-widest text-sm">
                                        {showShareModal === 'main' ? 'Compartilhar Site da Empresa' : `Compartilhar Perfil: ${doctors.find(d => d.id === showShareModal)?.name}`}
                                    </h3>
                                    <button onClick={() => setShowShareModal(null)} className="text-slate-900 hover:text-red-600 transition-colors">
                                        <i className="fas fa-times text-xl"></i>
                                    </button>
                                </div>
                                
                                <div className="p-8 space-y-8">
                                    <div className="space-y-6">
                                        <div className="space-y-2">
                                            <label className="text-[9px] font-black uppercase text-slate-900">Link Direto</label>
                                            <div className="bg-slate-50 p-4 border border-slate-200 font-mono text-[10px] break-all select-all mb-4">
                                                {showShareModal === 'main' 
                                                    ? `${window.location.origin}${window.location.pathname}`
                                                    : `${window.location.origin}${window.location.pathname}#doctor_details?id=${showShareModal}`
                                                }
                                            </div>
                                            <button 
                                                onClick={() => {
                                                    const url = showShareModal === 'main' 
                                                        ? `${window.location.origin}${window.location.pathname}`
                                                        : `${window.location.origin}${window.location.pathname}#doctor_details?id=${showShareModal}`;
                                                    navigator.clipboard.writeText(url);
                                                    showNotification('Link copiado!');
                                                }}
                                                className="w-full py-3 bg-white border border-slate-900 text-slate-900 font-black uppercase text-[10px] tracking-widest hover:bg-slate-50 transition-all flex items-center justify-center gap-2"
                                            >
                                                <i className="fas fa-copy"></i> COPIAR LINK
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [doctors, setDoctors] = useState([]);
            const [appointments, setAppointments] = useState([]);
            const [supportMessages, setSupportMessages] = useState([]);
            const [currentView, setCurrentView] = useState('home');
            const [selectedDoctorId, setSelectedDoctorId] = useState(null);
            const [loggedInDoctorId, setLoggedInDoctorId] = useState(null);
            const [loggedInProfessionalId, setLoggedInProfessionalId] = useState(null);
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [notification, setNotification] = useState(null);
            const [confirmation, setConfirmation] = useState(null);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const showConfirmation = (message, onConfirm) => {
                setConfirmation({ message, onConfirm: () => { onConfirm(); setConfirmation(null); }, onCancel: () => setConfirmation(null) });
            };

            useEffect(() => {
                const handleAppNotification = (e) => showNotification(e.detail.message, e.detail.type);
                window.addEventListener('app-notification', handleAppNotification);
                return () => window.removeEventListener('app-notification', handleAppNotification);
            }, []);
            const [user, setUser] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);

            // --- AUTH STATE ---
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsAuthReady(true);
                });
                return () => unsubscribe();
            }, []);

            // --- TEST CONNECTION ---
            useEffect(() => {
                const testConnection = async () => {
                    try {
                        await getDocFromServer(doc(db, 'test', 'connection'));
                    } catch (error) {
                        if (error instanceof Error && error.message.includes('the client is offline')) {
                            console.error("Please check your Firebase configuration.");
                        }
                    }
                };
                testConnection();
            }, []);

            // --- FIRESTORE LISTENERS ---
            useEffect(() => {
                const initData = async () => {
                    try {
                        const configRef = doc(db, 'system', 'config');
                        const configSnap = await getDocFromServer(configRef);
                        if (!configSnap.exists()) {
                            console.log("System config not found. Checking if seeding is needed...");
                            // Check if doctors collection is empty as a secondary check
                            const doctorsSnap = await getDocs(collection(db, 'doctors'));
                            if (doctorsSnap.empty) {
                                console.log("Doctors collection empty. Seeding initial data...");
                                for (const docData of INITIAL_DOCTORS) {
                                    await setDoc(doc(db, 'doctors', docData.id), docData);
                                }
                                await setDoc(configRef, { seeded: true, createdAt: new Date().toISOString() });
                                console.log("Database initialized with seed data.");
                            } else {
                                console.log("Doctors collection not empty. Skipping seed and marking as seeded.");
                                await setDoc(configRef, { seeded: true, createdAt: new Date().toISOString() });
                            }
                        } else {
                            console.log("System already seeded.");
                        }
                    } catch (e) {
                        console.error("Initialization check failed:", e);
                    }
                };
                initData();

                const qDoctors = collection(db, 'doctors');
                const unsubscribeDoctors = onSnapshot(qDoctors, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    setDoctors(docs);
                }, (error) => {
                    handleFirestoreError(error, OperationType.LIST, 'doctors');
                });

                const qAppointments = collection(db, 'appointments');
                const unsubscribeAppointments = onSnapshot(qAppointments, (snapshot) => {
                    const apps = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    setAppointments(apps);
                }, (error) => {
                    handleFirestoreError(error, OperationType.LIST, 'appointments');
                });

                const qSupport = collection(db, 'support_messages');
                const unsubscribeSupport = onSnapshot(qSupport, (snapshot) => {
                    const msgs = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    msgs.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                    setSupportMessages(msgs);
                }, (error) => {
                    console.error("Error loading support messages:", error);
                });

                return () => {
                    unsubscribeDoctors();
                    unsubscribeAppointments();
                    unsubscribeSupport();
                };
            }, []);

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '').split('?')[0] || 'home';
                    setCurrentView(hash);
                    const params = new URLSearchParams(window.location.hash.split('?')[1]);
                    setSelectedDoctorId(params.get('id'));
                };
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const navigateTo = (view, params) => {
                let hash = `#${view}`;
                if (params) hash += `?${new URLSearchParams(params).toString()}`;
                window.location.hash = hash;
            };

            const handleConfirm = async (appData) => {
                try {
                    await setDoc(doc(db, 'appointments', appData.id), appData);
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'appointments');
                }
            };

            const handleCancel = async (id) => {
                try {
                    const appRef = doc(db, 'appointments', id);
                    await updateDoc(appRef, { status: 'cancelled' });
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'appointments');
                }
            };

            const handleUpdateAppointment = async (id, updates) => {
                try {
                    const appRef = doc(db, 'appointments', id);
                    await updateDoc(appRef, updates);
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'appointments');
                }
            };

            const handleSignup = async (newDoctor) => {
                try {
                    await setDoc(doc(db, 'doctors', newDoctor.id), newDoctor);
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'doctors');
                }
            };

            const handleUpdateDoctor = async (id, updates) => {
                try {
                    const docRef = doc(db, 'doctors', id);
                    await updateDoc(docRef, updates);
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'doctors');
                }
            };

            const handleDeleteDoctor = async (id) => {
                try {
                    await deleteDoc(doc(db, 'doctors', id));
                } catch (e) {
                    handleFirestoreError(e, OperationType.DELETE, 'doctors');
                }
            };

            const handleAdminAuth = (success) => {
                setIsAdminAuthenticated(success);
            };

            const handleAdminLogout = async () => {
                try {
                    await signOut(auth);
                    setIsAdminAuthenticated(false);
                } catch (e) {
                    console.error("Logout failed", e);
                }
            };

            const handleSendSupportMessage = async (msgData) => {
                try {
                    const newMsgRef = doc(collection(db, 'support_messages'));
                    await setDoc(newMsgRef, {
                        ...msgData,
                        id: newMsgRef.id,
                        createdAt: new Date().toISOString()
                    });
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'support_messages');
                }
            };

            const selectedDoctor = doctors.find(d => d.id === selectedDoctorId);

            return (
                <div className="min-h-screen flex flex-col">
                    <Header currentView={currentView} setView={navigateTo} />
                    <main className="flex-1">
                        {currentView === 'home' && <Home doctors={doctors} onSelectDoctor={(id) => navigateTo('doctor_details', {id})} selectedDoctorId={selectedDoctorId} />}
                        <div className={`mx-auto px-4 py-8 lg:py-4 lg:max-w-none ${currentView === 'doctor_details' ? 'lg:max-w-none' : 'lg:max-w-none'}`}>
                            {currentView === 'doctor_details' && selectedDoctor && <DoctorDetails doctor={selectedDoctor} appointments={appointments} onConfirm={handleConfirm} />}
                            {currentView === 'consult_appointments' && (
                                <ConsultAppointments 
                                    appointments={appointments} 
                                    doctors={doctors}
                                    onCancel={handleCancel} 
                                    showNotification={showNotification}
                                    showConfirmation={showConfirmation}
                                />
                            )}
                            {currentView === 'professional_signup' && <ProfessionalSignup onSignup={handleSignup} />}
                            {currentView === 'professional_dashboard' && (
                                <ProfessionalDashboard 
                                    doctors={doctors} 
                                    appointments={appointments} 
                                    setDoctors={handleUpdateDoctor} 
                                    supportMessages={supportMessages}
                                    onSendSupportMessage={handleSendSupportMessage}
                                    loggedInId={loggedInDoctorId} 
                                    loggedInProfessionalId={loggedInProfessionalId}
                                    onLogin={(id, profId) => { setLoggedInDoctorId(id); setLoggedInProfessionalId(profId || null); }} 
                                    onLogout={() => { setLoggedInDoctorId(null); setLoggedInProfessionalId(null); }} 
                                    onCancelAppointment={handleCancel} 
                                    onUpdateAppointment={handleUpdateAppointment}
                                    onConfirmAppointment={handleConfirm}
                                    showNotification={showNotification}
                                    showConfirmation={showConfirmation}
                                />
                            )}
                            {currentView === 'admin_dashboard' && (
                                <AdminDashboard 
                                    doctors={doctors} 
                                    setDoctors={handleUpdateDoctor} 
                                    onDeleteDoctor={handleDeleteDoctor} 
                                    appointments={appointments}
                                    onUpdateAppointment={handleUpdateAppointment}
                                    supportMessages={supportMessages}
                                    onSendSupportMessage={handleSendSupportMessage}
                                    isAuthenticated={isAdminAuthenticated} 
                                    onAuthenticate={handleAdminAuth} 
                                    showNotification={showNotification} 
                                    showConfirmation={showConfirmation} 
                                />
                            )}
                        </div>
                    </main>
                    <Footer />
                    {notification && <Notification message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}
                    {confirmation && <ConfirmationModal message={confirmation.message} onConfirm={confirmation.onConfirm} onCancel={confirmation.onCancel} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
