            const [currentView, setCurrentView] = useState('home');
            const [selectedDoctorId, setSelectedDoctorId] = useState(null);
            const [loggedInDoctorId, setLoggedInDoctorId] = useState(null);
            const [loggedInProfessionalId, setLoggedInProfessionalId] = useState(null);
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [notification, setNotification] = useState(null);
            const [confirmation, setConfirmation] = useState(null);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const showConfirmation = (message, onConfirm) => {
                setConfirmation({ message, onConfirm: () => { onConfirm(); setConfirmation(null); }, onCancel: () => setConfirmation(null) });
            };

            useEffect(() => {
                const handleAppNotification = (e) => showNotification(e.detail.message, e.detail.type);
                window.addEventListener('app-notification', handleAppNotification);
                return () => window.removeEventListener('app-notification', handleAppNotification);
            }, []);
            const [user, setUser] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);

            // --- AUTH STATE ---
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsAuthReady(true);
                });
                return () => unsubscribe();
            }, []);

            // --- TEST CONNECTION ---
            useEffect(() => {
                const testConnection = async () => {
                    try {
                        await getDocFromServer(doc(db, 'test', 'connection'));
                    } catch (error) {
                        if (error instanceof Error && error.message.includes('the client is offline')) {
                            console.error("Please check your Firebase configuration.");
                        }
                    }
                };
                testConnection();
            }, []);

            // --- FIRESTORE LISTENERS ---
            useEffect(() => {
                const initData = async () => {
                    try {
                        const configRef = doc(db, 'system', 'config');
                        const configSnap = await getDocFromServer(configRef);
                        if (!configSnap.exists()) {
                            console.log("System config not found. Checking if seeding is needed...");
                            // Check if doctors collection is empty as a secondary check
                            const doctorsSnap = await getDocs(collection(db, 'doctors'));
                            if (doctorsSnap.empty) {
                                console.log("Doctors collection empty. Seeding initial data...");
                                for (const docData of INITIAL_DOCTORS) {
                                    await setDoc(doc(db, 'doctors', docData.id), docData);
                                }
                                await setDoc(configRef, { seeded: true, createdAt: new Date().toISOString() });
                                console.log("Database initialized with seed data.");
                            } else {
                                console.log("Doctors collection not empty. Skipping seed and marking as seeded.");
                                await setDoc(configRef, { seeded: true, createdAt: new Date().toISOString() });
                            }
                        } else {
                            console.log("System already seeded.");
                        }
                    } catch (e) {
                        console.error("Initialization check failed:", e);
                    }
                };
                initData();

                const qDoctors = collection(db, 'doctors');
                const unsubscribeDoctors = onSnapshot(qDoctors, (snapshot) => {
                    const docs = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    setDoctors(docs);
                }, (error) => {
                    handleFirestoreError(error, OperationType.LIST, 'doctors');
                });

                const qAppointments = collection(db, 'appointments');
                const unsubscribeAppointments = onSnapshot(qAppointments, (snapshot) => {
                    const apps = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    setAppointments(apps);
                }, (error) => {
                    handleFirestoreError(error, OperationType.LIST, 'appointments');
                });

                const qSupport = collection(db, 'support_messages');
                const unsubscribeSupport = onSnapshot(qSupport, (snapshot) => {
                    const msgs = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
                    msgs.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
                    setSupportMessages(msgs);
                }, (error) => {
                    console.error("Error loading support messages:", error);
                });

                return () => {
                    unsubscribeDoctors();
                    unsubscribeAppointments();
                    unsubscribeSupport();
                };
            }, []);

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '').split('?')[0] || 'home';
                    setCurrentView(hash);
                    const params = new URLSearchParams(window.location.hash.split('?')[1]);
                    setSelectedDoctorId(params.get('id'));
                };
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const navigateTo = (view, params) => {
                let hash = `#${view}`;
                if (params) hash += `?${new URLSearchParams(params).toString()}`;
                window.location.hash = hash;
            };

            const handleConfirm = async (appData) => {
                try {
                    await setDoc(doc(db, 'appointments', appData.id), appData);
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'appointments');
                }
            };

            const handleCancel = async (id) => {
                try {
                    const appRef = doc(db, 'appointments', id);
                    await updateDoc(appRef, { status: 'cancelled' });
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'appointments');
                }
            };

            const handleUpdateAppointment = async (id, updates) => {
                try {
                    const appRef = doc(db, 'appointments', id);
                    await updateDoc(appRef, updates);
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'appointments');
                }
            };

            const handleSignup = async (newDoctor) => {
                try {
                    await setDoc(doc(db, 'doctors', newDoctor.id), newDoctor);
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'doctors');
                }
            };

            const handleUpdateDoctor = async (id, updates) => {
                try {
                    const docRef = doc(db, 'doctors', id);
                    await updateDoc(docRef, updates);
                } catch (e) {
                    handleFirestoreError(e, OperationType.UPDATE, 'doctors');
                }
            };

            const handleDeleteDoctor = async (id) => {
                try {
                    await deleteDoc(doc(db, 'doctors', id));
                } catch (e) {
                    handleFirestoreError(e, OperationType.DELETE, 'doctors');
                }
            };

            const handleAdminAuth = (success) => {
                setIsAdminAuthenticated(success);
            };

            const handleAdminLogout = async () => {
                try {
                    await signOut(auth);
                    setIsAdminAuthenticated(false);
                } catch (e) {
                    console.error("Logout failed", e);
                }
            };

            const handleSendSupportMessage = async (msgData) => {
                try {
                    const newMsgRef = doc(collection(db, 'support_messages'));
                    await setDoc(newMsgRef, {
                        ...msgData,
                        id: newMsgRef.id,
                        createdAt: new Date().toISOString()
                    });
                } catch (e) {
                    handleFirestoreError(e, OperationType.WRITE, 'support_messages');
                }
            };

            const selectedDoctor = doctors.find(d => d.id === selectedDoctorId);

            return (
                <div className="min-h-screen flex flex-col">
                    <Header currentView={currentView} setView={navigateTo} />
                    <main className="flex-1">
                        {currentView === 'home' && <Home doctors={doctors} onSelectDoctor={(id) => navigateTo('doctor_details', {id})} selectedDoctorId={selectedDoctorId} />}
                        <div className={`mx-auto px-4 py-8 lg:py-4 lg:max-w-none ${currentView === 'doctor_details' ? 'lg:max-w-none' : 'lg:max-w-none'}`}>
                            {currentView === 'doctor_details' && selectedDoctor && <DoctorDetails doctor={selectedDoctor} appointments={appointments} onConfirm={handleConfirm} />}
                            {currentView === 'consult_appointments' && (
                                <ConsultAppointments 
                                    appointments={appointments} 
                                    doctors={doctors}
                                    onCancel={handleCancel} 
                                    showNotification={showNotification}
                                    showConfirmation={showConfirmation}
                                />
                            )}
                            {currentView === 'professional_signup' && <ProfessionalSignup onSignup={handleSignup} />}
                            {currentView === 'professional_dashboard' && (
                                <ProfessionalDashboard 
                                    doctors={doctors} 
                                    appointments={appointments} 
                                    setDoctors={handleUpdateDoctor} 
                                    supportMessages={supportMessages}
                                    onSendSupportMessage={handleSendSupportMessage}
                                    loggedInId={loggedInDoctorId} 
                                    loggedInProfessionalId={loggedInProfessionalId}
                                    onLogin={(id, profId) => { setLoggedInDoctorId(id); setLoggedInProfessionalId(profId || null); }} 
                                    onLogout={() => { setLoggedInDoctorId(null); setLoggedInProfessionalId(null); }} 
                                    onCancelAppointment={handleCancel} 
                                    onUpdateAppointment={handleUpdateAppointment}
                                    showNotification={showNotification}
                                    showConfirmation={showConfirmation}
                                />
                            )}
                            {currentView === 'admin_dashboard' && (
                                <AdminDashboard 
                                    doctors={doctors} 
                                    setDoctors={handleUpdateDoctor} 
                                    onDeleteDoctor={handleDeleteDoctor} 
                                    appointments={appointments}
                                    onUpdateAppointment={handleUpdateAppointment}
                                    supportMessages={supportMessages}
                                    onSendSupportMessage={handleSendSupportMessage}
                                    isAuthenticated={isAdminAuthenticated} 
                                    onAuthenticate={handleAdminAuth} 
                                    showNotification={showNotification} 
                                    showConfirmation={showConfirmation} 
                                />
                            )}
                        </div>
                    </main>
                    <Footer />
                    {notification && <Notification message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}
                    {confirmation && <ConfirmationModal message={confirmation.message} onConfirm={confirmation.onConfirm} onCancel={confirmation.onCancel} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
