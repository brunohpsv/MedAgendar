        // --- UTILS ---
        const timeToMin = (t) => {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };

        const minToTime = (m) => {
            const h = Math.floor(m / 60);
            const min = m % 60;
            return `${h.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
        };

        const generateScheduleFromConfig = (config) => {
            if (!config || !config.daysOfWeek) return [];
            const schedule = [];
            const today = new Date();
            for (let i = 0; i < 30; i++) {
                const currentDate = new Date(today);
                currentDate.setDate(today.getDate() + i);
                const dayOfWeek = currentDate.getDay();
                if (config.daysOfWeek.includes(dayOfWeek)) {
                    const slots = [];
                    let currentMin = timeToMin(config.startTime || "08:00");
                    const endMin = timeToMin(config.endTime || "18:00");
                    const duration = Number(config.slotDuration) || 30;
                    const interval = Number(config.minInterval) || 0;
                    
                    while (currentMin + duration <= endMin) {
                        const slotStart = currentMin;
                        const slotEnd = currentMin + duration;
                        let isDuringBreak = false;
                        if (config.breaks?.lunch?.active) {
                            const lStart = timeToMin(config.breaks.lunch.start || "12:00");
                            const lEnd = timeToMin(config.breaks.lunch.end || "13:30");
                            if (!(slotEnd <= lStart || slotStart >= lEnd)) isDuringBreak = true;
                        }
                        if (config.breaks?.snack?.active) {
                            const sStart = timeToMin(config.breaks.snack.start || "16:00");
                            const sEnd = timeToMin(config.breaks.snack.end || "16:30");
                            if (!(slotEnd <= sStart || slotStart >= sEnd)) isDuringBreak = true;
                        }
                        if (!isDuringBreak) slots.push(minToTime(currentMin));
                        currentMin += duration + interval;
                    }
                    if (slots.length > 0) {
                        const year = currentDate.getFullYear();
                        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                        const dayNum = String(currentDate.getDate()).padStart(2, '0');
                        const dateStr = `${year}-${month}-${dayNum}`;
                        const labels = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
                        const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
                        const label = `${labels[dayOfWeek]}, ${dayNum} ${months[currentDate.getMonth()]}`;
                        schedule.push({ date: dateStr, label: label, slots: slots });
                    }
                }
            }
            return schedule;

                                <p className="text-[11px] font-black text-slate-900 uppercase tracking-widest break-words whitespace-normal">
                                    {doctor.specialties.join(' • ')}
                                </p>
                                {doctor.isClinic && doctor.professionals && doctor.professionals.length > 0 && (
                                    <p className="text-[10px] font-bold text-red-600 uppercase tracking-widest">
                                        <i className="fas fa-users mr-1"></i> {doctor.professionals.length} PROFISSIONAIS
                                    </p>
                                )}
                                <p className="text-[10px] font-bold text-slate-900 uppercase tracking-widest break-words whitespace-normal">
                                    <i className="fas fa-map-marker-alt mr-1 text-red-600"></i> {doctor.city}, {doctor.state}
                                </p>
                            </div>
                        </div>
                    </div>
                    <div className="flex items-center justify-between sm:justify-end sm:flex-col sm:items-end gap-2 shrink-0 pt-3 sm:pt-0 border-t sm:border-t-0 border-slate-100 w-full sm:w-auto">
                        <div className="text-left sm:text-right">
                            <span className="text-[9px] font-black text-slate-900 uppercase block tracking-widest leading-none mb-0.5">CONSULTA</span>
                            <span className="text-sm sm:text-base font-black tracking-tighter text-slate-900">{displayPrice}</span>
                        </div>
                        <div className="px-5 py-3 sm:px-4 sm:py-2 bg-red-600 text-white font-black text-xs sm:text-[10px] uppercase tracking-[0.1em] flex items-center justify-center gap-2 hover:bg-red-700 transition-colors border border-white whitespace-nowrap shadow-md min-h-[44px] sm:min-h-[36px] w-full sm:w-auto">AGENDAR <i className="fas fa-arrow-right text-[10px] sm:text-[8px]"></i></div>
                    </div>
                </div>
            );
        };

        const Home = ({ doctors, onSelectDoctor, selectedDoctorId }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [locationTerm, setLocationTerm] = useState('');

            const normalizeStr = (str) => {
                if (!str) return '';
                return String(str)
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '');
            };

            const cleanStr = (str) => {
                if (!str) return '';
                return String(str)
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '');
            };

            const filteredDoctors = useMemo(() => {
                const sNorm = normalizeStr(searchTerm);
                const sClean = cleanStr(searchTerm).trim();
                const lNorm = normalizeStr(locationTerm);
                const lClean = cleanStr(locationTerm).trim();

                return (doctors || []).filter(doc => {
                    if (!doc || !doc.name) return false;
                    
                    const isActive = doc.status === 'active' || !doc.status;
                    if (!isActive) return false;

                    let matchesSearch = true;
                    if (sNorm || sClean) {
                        const docNameNorm = normalizeStr(doc.name);
                        const docNameClean = cleanStr(doc.name);

                        const specs = Array.isArray(doc.specialties) ? doc.specialties : [doc.specialties || ''];
                        const specMatch = specs.some(s => 
                            normalizeStr(s).includes(sNorm) || cleanStr(s).includes(sClean)
                        );

                        const crmMatch = doc.crm && (normalizeStr(doc.crm).includes(sNorm) || cleanStr(doc.crm).includes(sClean));
                        const cnpjMatch = doc.cnpj && (normalizeStr(doc.cnpj).includes(sNorm) || cleanStr(doc.cnpj).includes(sClean));
                        const cpfMatch = doc.cpf && (normalizeStr(doc.cpf).includes(sNorm) || cleanStr(doc.cpf).includes(sClean));

                        const profsMatch = Array.isArray(doc.professionals) && doc.professionals.some(prof => {
                            if (!prof || prof.status === 'suspended') return false;
                            const pNameNorm = normalizeStr(prof.name);
                            const pNameClean = cleanStr(prof.name);
                            const pSpecs = Array.isArray(prof.specialties) ? prof.specialties : [prof.specialties || ''];
                            const pSpecMatch = pSpecs.some(s => 
                                normalizeStr(s).includes(sNorm) || cleanStr(s).includes(sClean)
                            );
                            const pCrmMatch = prof.crm && (normalizeStr(prof.crm).includes(sNorm) || cleanStr(prof.crm).includes(sClean));
                            return pNameNorm.includes(sNorm) || pNameClean.includes(sClean) || pSpecMatch || pCrmMatch;
                        });

                        matchesSearch = (
                            docNameNorm.includes(sNorm) ||
                            docNameClean.includes(sClean) ||
                            specMatch ||
                            crmMatch ||
                            cnpjMatch ||
                            cpfMatch ||
                            profsMatch
                        );
                    }

                    let matchesLocation = true;
                    if (lNorm || lClean) {
                        const cityNorm = normalizeStr(doc.city);
                        const cityClean = cleanStr(doc.city);
                        const stateNorm = normalizeStr(doc.state);
                        const stateClean = cleanStr(doc.state);
                        const addressNorm = normalizeStr(doc.address);
                        const addressClean = cleanStr(doc.address);
                        const neighborNorm = normalizeStr(doc.neighborhood);
                        const neighborClean = cleanStr(doc.neighborhood);

                        matchesLocation = (
                            cityNorm.includes(lNorm) || cityClean.includes(lClean) ||
                            stateNorm.includes(lNorm) || stateClean.includes(lClean) ||
                            addressNorm.includes(lNorm) || addressClean.includes(lClean) ||
                            neighborNorm.includes(lNorm) || neighborClean.includes(lClean)
                        );
                    }

                    return matchesSearch && matchesLocation;
                });
            }, [doctors, searchTerm, locationTerm]);

            return (
                <div className="animate-slide-up">
                    <section className="bg-white py-8 lg:py-6 border-b border-slate-200 relative">
                        <div className="lg:max-w-none mx-auto px-6 sm:px-8 relative z-10">
                            <h1 className="text-3xl lg:text-3xl font-black text-slate-900 tracking-tighter leading-none uppercase mb-4">ENCONTRE O SEU <br/><span className="text-red-600">ESPECIALISTA</span></h1>
                            <div className="lg:max-w-none grid grid-cols-1 md:grid-cols-12 gap-0 border border-slate-900 bg-white shadow-2xl">
                                <div className="md:col-span-5 flex items-center px-4 py-3 border-b md:border-b-0 md:border-r border-slate-100 bg-white">
                                    <i className="fas fa-search text-red-600 mr-3 text-xs"></i>
                                    <input type="text" placeholder="MÉDICO, ESPECIALIDADE, CLINICA OU HOSPITAL" className="bg-transparent w-full outline-none text-slate-900 font-black text-[12px] placeholder:text-slate-500 uppercase tracking-widest" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                                <div className="md:col-span-4 flex items-center px-4 py-3 bg-white">
                                    <i className="fas fa-location-arrow text-red-600 mr-3 text-xs"></i>
                                    <input type="text" placeholder="CIDADE OU UF" className="bg-transparent w-full outline-none text-slate-900 font-black text-[12px] placeholder:text-slate-500 uppercase tracking-widest" value={locationTerm} onChange={(e) => setLocationTerm(e.target.value)} />
                                </div>
                                <button className="md:col-span-3 bg-red-600 px-6 py-3 font-black text-[12px] uppercase tracking-[0.2em] text-white transition-all hover:bg-red-700 border border-white">FILTRAR</button>
                            </div>
                        </div>
                    </section>
                    <section className="lg:max-w-none mx-auto px-4 lg:px-8 py-6 lg:py-4">
                        {filteredDoctors.length > 0 ? (
                            <div className="grid grid-cols-1 gap-3">
                                {filteredDoctors.map(doc => (
                                    <DoctorCard key={doc.id} doctor={doc} isActive={selectedDoctorId === doc.id} onClick={() => onSelectDoctor(doc.id)} />
                                ))}
                            </div>
                        ) : (
                            <div className="bg-white p-8 text-center border border-slate-200 shadow-sm space-y-3">
                                <i className="fas fa-search-minus text-3xl text-slate-300 mb-2"></i>
                                <p className="text-xs font-black uppercase tracking-wider text-slate-700">Nenhum profissional ou clínica encontrado com os termos pesquisados.</p>
                                <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Tente buscar por nome, especialidade, cidade ou UF.</p>
                                {(searchTerm || locationTerm) && (
                                    <button onClick={() => { setSearchTerm(''); setLocationTerm(''); }} className="mt-2 px-4 py-2 bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest hover:bg-red-600 transition-colors">
                                        LIMPAR FILTROS
                                    </button>
                                )}
                            </div>
                        )}
                    </section>
                    <section className="lg:max-w-none mx-auto px-4 lg:px-8 py-6 lg:py-6 border-t border-slate-100">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                            <div><PartnerSection /></div>
                            <div className="space-y-4">
                                <h2 className="text-3xl font-black uppercase tracking-tighter">JUNTE-SE À <br/><span className="text-red-600">MAIOR REDE</span></h2>
                                <p className="text-slate-900 text-xs font-medium leading-relaxed">Nossa plataforma conecta milhares de pacientes a profissionais qualificados todos os dias. Tenha sua agenda organizada e sua visibilidade aumentada com o MedAgendar.</p>
                                <button onClick={() => window.location.hash = '#professional_signup'} className="px-8 py-4 bg-red-600 text-white font-black uppercase text-[12px] tracking-widest hover:bg-red-700 transition-all shadow-lg active-scale">QUERO SER PARCEIRO</button>
                            </div>
                        </div>
                    </section>
                </div>
            );
        };

        const DoctorDetails = ({ doctor, appointments, onConfirm }) => {
            if (!doctor) return <div className="p-20 text-center font-black uppercase text-slate-900">Carregando profissional...</div>;
            const [step, setStep] = useState('schedule');
            const [selectedDayDate, setSelectedDayDate] = useState("");
            const [selectedSlot, setSelectedSlot] = useState("");
            const [selectedProfessionalId, setSelectedProfessionalId] = useState("");
            const [patientData, setPatientData] = useState({ name: '', phone: '', cpf: '' });

            const selectedProfessional = useMemo(() => {
                if (!doctor.isClinic || !selectedProfessionalId) return null;
                return (doctor.professionals || []).find(p => p.id === selectedProfessionalId);
            }, [doctor, selectedProfessionalId]);

            const activeWorkConfig = (selectedProfessional ? selectedProfessional.workConfig : doctor.workConfig) || DEFAULT_WORK_CONFIG;
            const activeMaxSlots = selectedProfessional ? selectedProfessional.maxSlotsPerTime : doctor.maxSlotsPerTime;

            const activeSchedule = useMemo(() => {
                const rawSchedule = (selectedProfessional ? selectedProfessional.schedule : doctor.schedule) || [];
                const daysOfWeek = activeWorkConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                return rawSchedule.filter(day => {
                    if (!day.date || !day.slots || day.slots.length === 0) return false;
                    const dateObj = new Date(day.date + 'T12:00:00');
                    return daysOfWeek.includes(dateObj.getDay());
                });
            }, [doctor, selectedProfessional, activeWorkConfig]);

            useEffect(() => {
                if (activeSchedule && activeSchedule.length > 0) {
                    if (!activeSchedule.some(d => d.date === selectedDayDate)) {
                        setSelectedDayDate(activeSchedule[0].date);
                    }
                } else {
                    setSelectedDayDate("");
                }
            }, [activeSchedule, selectedDayDate]);

            const availableSlots = useMemo(() => {
                if (!activeSchedule) return [];
                const day = activeSchedule.find(d => d.date === selectedDayDate);
                if (!day) return [];
                
                const rules = activeWorkConfig.groupingRules || [];
                const capacities = activeWorkConfig.slotCapacities || {};
                const globalMax = activeMaxSlots || 1;
                
                // Get day of week (0-6)
                const dateObj = new Date(selectedDayDate + 'T12:00:00');
                const dayOfWeek = dateObj.getDay();

                return day.slots.map(slot => {
                    // Find applicable rule
                    // Priority: Specific Date > Days of Week > Specific Time Capacity > Global Max
                    // We search rules in reverse order (newest first)
                    let maxSlots = globalMax;
                    
                    // 1. Check specific time capacity (legacy/simple override)
                    if (capacities[slot] !== undefined) {
                        maxSlots = capacities[slot];
                    }

                    // 2. Check rules (newest first)
                    const reversedRules = [...rules].reverse();
                    const applicableRules = reversedRules.filter(rule => rule.times.includes(slot) || rule.times.includes('all'));
                    
                    // Specific date rule
                    const dateRule = applicableRules.find(r => r.type === 'date' && r.date === selectedDayDate);
                    if (dateRule) {
                        maxSlots = dateRule.capacity;
                    } else {
                        // Days of week rule
                        const daysRule = applicableRules.find(r => r.type === 'days' && r.days.includes(dayOfWeek));
                        if (daysRule) {
                            maxSlots = daysRule.capacity;
                        } else {
                            // All dates rule (if exists for this time)
                            const allDatesRule = applicableRules.find(r => r.type === 'all');
                            if (allDatesRule) {
                                maxSlots = allDatesRule.capacity;
                            }
                        }
                    }

                    const count = appointments.filter(app => 
                        app.doctorId === doctor.id && 
                        (!doctor.isClinic || app.professionalId === selectedProfessionalId) &&
                        app.date === day.date && 
                        app.time === slot && 
                        app.status === 'confirmed'
                    ).length;

                    return {
                        time: slot,
                        count,
                        max: maxSlots,
                        available: count < maxSlots
                    };
                });
            }, [doctor, selectedDayDate, appointments, selectedProfessionalId, activeSchedule, activeWorkConfig, activeMaxSlots]);

            const finalize = () => {
                onConfirm({ 
                    id: Math.random().toString(36).substr(2, 6).toUpperCase(), 
                    doctorId: doctor.id, 
                    doctorName: doctor.name, 
                    professionalId: selectedProfessionalId || null,
                    professionalName: selectedProfessional ? selectedProfessional.name : null,
                    date: selectedDayDate, 
                    time: selectedSlot, 
                    patientName: patientData.name, 
                    patientPhone: patientData.phone, 
                    patientCPF: patientData.cpf, 
                    status: 'confirmed', 
                    createdAt: new Date().toISOString() 
                });
                setStep('success');
            };

            if (step === 'success') return (
                <div className="lg:max-w-none mx-auto py-12 lg:py-8 text-center border-4 border-slate-200 bg-white shadow-2xl mt-10 animate-slide-up">
                    <div className="w-20 h-20 bg-emerald-500 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-lg">
                        <i className="fas fa-check"></i>
                    </div>
                    <h2 className="text-2xl lg:text-xl font-black text-slate-900 mb-2 uppercase tracking-tighter">Agendamento Confirmado!</h2>
                    <p className="text-[12px] font-bold text-slate-900 uppercase tracking-[0.2em] mb-8">Seu horário foi reservado com sucesso.</p>
                    
                    <div className="max-w-md mx-auto p-6 bg-slate-50 border-2 border-dashed border-slate-200 mb-8">
                        <p className="text-[12px] font-black text-red-600 uppercase tracking-widest leading-relaxed">
                            <i className="fas fa-exclamation-circle mr-2"></i>
                            IMPORTANTE: Acesse a página "MEUS AGENDAMENTOS" para verificar o status da sua consulta e baixar documentos anexados pelo profissional.
                        </p>
                    </div>

                    <button onClick={() => window.location.hash = '#home'} className="px-12 py-4 bg-red-600 text-white font-black uppercase text-[11px] tracking-widest hover:bg-red-700 transition-all active-scale shadow-xl">VOLTAR AO INÍCIO</button>
                </div>
            );

            const docLocationQuery = [doctor.address, doctor.city, doctor.state].filter(Boolean).join(', ') || doctor.clinicAddress || `${doctor.name}, ${doctor.city || ''}`;
            const googleMapsDirectionsUrl = (doctor.mapUrl && String(doctor.mapUrl).trim().startsWith('http') && !doctor.mapUrl.includes('search/?api=1'))
                ? doctor.mapUrl.trim()
                : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(docLocationQuery)}`;

            return (
                <div className="bg-white border border-slate-200 p-8 lg:p-4 shadow-2xl animate-slide-up">
                    <div className="flex flex-col md:flex-row gap-10 lg:gap-4 mb-10 lg:mb-4">
                        <div className="w-full md:w-1/4 lg:w-1/5">
                            <div className="aspect-square border-2 border-slate-200 shadow-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                                {doctor.image ? (
                                    <img src={doctor.image} className="w-full h-full object-cover" alt={doctor.name} referrerPolicy="no-referrer" />
                                ) : (
                                    <i className="fas fa-user-md text-7xl lg:text-5xl text-slate-600"></i>
                                )}
                            </div>
                        </div>
                        <div className="w-full md:w-3/4 lg:w-4/5 space-y-6 lg:space-y-2">
                            <div>
                                <div className="flex items-center gap-3 mb-1">
                                    <h2 className="text-3xl lg:text-xl font-black uppercase tracking-tighter leading-none">{doctor.name}</h2>
                                    {doctor.isClinic && (
                                        <span className="px-2 py-0.5 bg-red-600 text-white text-[10px] font-black uppercase tracking-widest rounded">CLÍNICA</span>
                                    )}
                                </div>
                                <p className="text-sm font-black text-red-600 uppercase tracking-widest">{doctor.specialties.join(' • ')}</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {doctor.onlineConsultation && <span className="px-3 py-1 bg-emerald-100 text-emerald-700 text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5"><i className="fas fa-video"></i> CONSULTA ONLINE</span>}
                                <span className="px-3 py-1 bg-slate-100 text-slate-700 text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5"><i className="fas fa-map-marker-alt"></i> {doctor.city}, {doctor.state}</span>
                                {doctor.clinics && doctor.clinics.length > 0 && (
                                    <span className="px-3 py-1 bg-red-50 text-red-600 text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5">
                                        <i className="fas fa-hospital"></i> {doctor.clinics.join(' • ')}
                                    </span>
                                )}
                            </div>
                            <p className="text-sm lg:text-xs text-slate-600 font-medium leading-relaxed italic">"{doctor.bio}"</p>
                            {/* Seção de Localização da Clínica no Agendamento */}
                            <div className="p-5 lg:p-4 bg-slate-50 border-2 border-slate-200">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <div>
                                        <h4 className="text-xs font-black uppercase tracking-widest text-slate-900 flex items-center gap-2">
                                            <i className="fas fa-map-marked-alt text-red-600 text-sm"></i>
                                            Localização da Clínica / Consultório
                                        </h4>
                                        <p className="text-xs font-black uppercase text-slate-900 mt-1">
                                            {doctor.address || doctor.clinicAddress || `${doctor.city || ''}, ${doctor.state || ''}`}
                                        </p>
                                    </div>
                                    <a 
                                        href={googleMapsDirectionsUrl} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="px-5 py-3.5 sm:px-4 sm:py-2.5 bg-red-600 text-white font-black uppercase text-xs sm:text-[10px] tracking-widest hover:bg-red-700 transition-all flex items-center justify-center gap-2 shadow-sm shrink-0 min-h-[44px] w-full sm:w-auto"
                                    >
                                        <i className="fas fa-directions"></i> COMO CHEGAR (GOOGLE MAPS)
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="border-t-2 border-slate-200 pt-10 lg:pt-6">
                        <h3 className="text-xl lg:text-lg font-black uppercase mb-8 lg:mb-4 tracking-tighter">Agendar Horário</h3>
                        
                        {doctor.isClinic && (
                            <div className="mb-10 lg:mb-6 animate-fade-in">
                                <h3 className="text-xs font-black uppercase text-red-600 tracking-[0.2em] mb-6 lg:mb-4 flex items-center gap-2">
                                    <span className="w-8 h-[2px] bg-red-600"></span>
                                    Escolha o Profissional
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 lg:gap-2">
                                    {(doctor.professionals || []).filter(p => p.status !== 'suspended').map(prof => (
                                        <button
                                            key={prof.id} 
                                            onClick={() => {
                                                setSelectedProfessionalId(prof.id);
                                                if (prof.schedule && prof.schedule.length > 0) {
                                                    setSelectedDayDate(prof.schedule[0].date);
                                                }
                                                setSelectedSlot("");
                                            }}
                                            className={`p-4 lg:p-3 border-2 flex items-center gap-4 lg:gap-3 transition-all text-left group ${selectedProfessionalId === prof.id ? 'border-red-600 bg-red-50 shadow-lg' : 'border-slate-100 hover:border-slate-300 bg-white'}`}
                                        >
                                            <div className={`w-14 h-14 lg:w-10 lg:h-10 rounded-full overflow-hidden border-2 transition-transform group-hover:scale-110 ${selectedProfessionalId === prof.id ? 'border-red-600' : 'border-slate-200'}`}>
                                                {prof.image ? (
                                                    <img src={prof.image} className="w-full h-full object-cover" alt={prof.name} referrerPolicy="no-referrer" />
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center bg-slate-100 text-slate-900">
                                                        <i className="fas fa-user-md text-xl lg:text-lg"></i>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <p className={`font-black uppercase text-xs lg:text-[11px] break-words whitespace-normal ${selectedProfessionalId === prof.id ? 'text-red-600' : 'text-slate-900'}`}>{prof.name}</p>
                                                <p className="text-[11px] font-bold text-slate-900 uppercase tracking-widest mt-1 break-words whitespace-normal">{prof.specialties?.join(', ')}</p>
                                            </div>
                                            {selectedProfessionalId === prof.id && (
                                                <div className="w-6 h-6 lg:w-5 lg:h-5 bg-red-600 rounded-full flex items-center justify-center text-white text-[12px] lg:text-[10px] shrink-0">
                                                    <i className="fas fa-check"></i>
                                                </div>
                                            )}
                                        </button>
                                    ))}
                                </div>
                                {(!doctor.professionals || doctor.professionals.filter(p => p.status !== 'suspended').length === 0) && (
                                    <p className="text-[12px] font-bold text-red-600 uppercase italic bg-red-50 p-4 lg:p-3 border border-dashed border-red-200 text-center">Nenhum profissional disponível nesta clínica no momento.</p>
                                )}
                            </div>
                        )}

                        {(!doctor.isClinic || selectedProfessionalId) && (
                            step === 'schedule' ? (
                                <div className="space-y-6 lg:space-y-4">
                                    <select value={selectedDayDate} onChange={(e) => setSelectedDayDate(e.target.value)} className="w-full p-4 lg:p-3 border border-slate-200 font-black uppercase text-xs min-h-[48px]">
                                        {activeSchedule.map(day => <option key={day.date} value={day.date}>{day.label}</option>)}
                                    </select>
                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2.5 lg:gap-1">
                                        {availableSlots.filter(s => s.available).map(slot => (
                                            <button 
                                                key={slot.time} 
                                                onClick={() => setSelectedSlot(slot.time)} 
                                                className={`py-3 px-2 lg:p-1.5 text-xs lg:text-[11px] font-black border flex flex-col items-center justify-center transition-all min-h-[44px] ${selectedSlot === slot.time ? 'bg-red-600 text-white border-red-600 shadow-lg' : 'bg-slate-50 hover:border-red-600 text-slate-900'}`}
                                            >
                                                <span>{slot.time}</span>
                                                {slot.max > 1 && (
                                                    <span className={`text-[10px] mt-0.5 font-bold ${selectedSlot === slot.time ? 'text-white/80' : 'text-slate-900'}`}>
                                                        {slot.count}/{slot.max}
                                                    </span>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                    <button disabled={!selectedSlot} onClick={() => setStep('form')} className="w-full py-4 lg:py-3 bg-red-600 text-white font-black uppercase text-xs tracking-widest disabled:opacity-50 min-h-[48px] shadow-md">CONTINUAR</button>
                                </div>
                            ) : (

                                <div className="flex items-center gap-3 p-3 lg:p-2 bg-slate-50 border border-slate-100"><input type="checkbox" name="onlineConsultation" id="onlineConsultation" className="w-4 h-4 accent-red-600" /><label htmlFor="onlineConsultation" className="text-[11px] font-black uppercase text-slate-900 cursor-pointer">Ofereço Consulta Online</label></div>
                                <div className="space-y-1 pt-2 lg:pt-1"><label className="text-[10px] font-black uppercase tracking-widest text-slate-900">Senha Painel</label><input name="accessCode" required type="password" placeholder="CRIE UMA SENHA" className="w-full p-3 lg:p-2 border border-slate-200 bg-white text-slate-900 font-black uppercase text-[12px] text-center outline-none focus:border-red-600" /></div>
                                <button type="submit" className="w-full py-4 lg:py-3 bg-red-600 text-white font-black uppercase text-[12px] tracking-widest hover:bg-red-700 transition-all shadow-lg active-scale">FINALIZAR CADASTRO</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfessionalDashboard = ({ doctors, appointments, setDoctors, loggedInId, loggedInProfessionalId, onLogin, onLogout, onCancelAppointment, onUpdateAppointment, supportMessages = [], onSendSupportMessage, showNotification, showConfirmation }) => {
            const formatDateLong = (dateStr) => {
                if (!dateStr) return 'DATA INVÁLIDA';
                if (!dateStr.includes('-')) {
                    return dateStr.toUpperCase()
                        .replace('QUA', 'QUARTA')
                        .replace('SEG', 'SEGUNDA')
                        .replace('TER', 'TERÇA')
                        .replace('QUI', 'QUINTA')
                        .replace('SEX', 'SEXTA')
                        .replace('SÁB', 'SÁBADO')
                        .replace('DOM', 'DOMINGO');
                }
                const parts = dateStr.split('-');
                if (parts.length !== 3) return dateStr.toUpperCase();
                const [year, month, day] = parts;
                const date = new Date(year, month - 1, day);
                if (isNaN(date.getTime())) return dateStr.toUpperCase();
                let label = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).toUpperCase();
                return label.replace('-FEIRA', '');
            };

            const [accessCode, setAccessCode] = useState('');
            const [loginStep, setLoginStep] = useState('password'); // 'password', 'select_prof'
            const [tempClinic, setTempClinic] = useState(null);
            const [activeTab, setActiveTab] = useState('appointments');
            const [chatInput, setChatInput] = useState('');
            const [localDoctor, setLocalDoctor] = useState(null);
            const [isGroupingOpen, setIsGroupingOpen] = useState(false);
            const [selectedGroupingTimes, setSelectedGroupingTimes] = useState(['all']);
            const [timeToConfigure, setTimeToConfigure] = useState('all');
            const [groupingQty, setGroupingQty] = useState(1);
            const [tempQuantities, setTempQuantities] = useState({}); // Map of time -> qty
            const [groupingRuleType, setGroupingRuleType] = useState('all'); // 'all', 'date', 'days'
            const [groupingRuleDate, setGroupingRuleDate] = useState('');
            const [groupingRuleDays, setGroupingRuleDays] = useState([]);
            const [newProf, setNewProf] = useState({ name: '', specialties: '', image: '' });
            const [notificationsViewed, setNotificationsViewed] = useState(false);
            const [reschedulingApp, setReschedulingApp] = useState(null);
            const [newRescheduleDate, setNewRescheduleDate] = useState('');
            const [newRescheduleTime, setNewRescheduleTime] = useState('');
            
            const loggedInDoctor = doctors.find(d => d.id === loggedInId);

            useEffect(() => {
                if (activeTab === 'notifications') {
                    setNotificationsViewed(true);
                }
            }, [activeTab]);

            useEffect(() => {
                if (loggedInDoctor) {
                    setLocalDoctor(JSON.parse(JSON.stringify(loggedInDoctor)));
                }
            }, [loggedInDoctor, loggedInId, loggedInProfessionalId]);

            useEffect(() => {
                if (loggedInDoctor && loggedInDoctor.isClinic && !loggedInProfessionalId && activeTab === 'appointments') {
                    setActiveTab('professionals');
                }
            }, [loggedInDoctor, loggedInProfessionalId]);

            const handleLogin = () => { 
                const cleanCode = accessCode.trim().toUpperCase();
                const doctor = doctors.find(d => d.accessCode && d.accessCode.trim().toUpperCase() === cleanCode); 
                if (doctor) {
                    if (doctor.isClinic) {
                        setTempClinic(doctor);
                        setLoginStep('select_prof');
                    } else {
                        onLogin(doctor.id); 
                    }
                } else {
                    showNotification("Código de acesso inválido. Verifique sua senha.", "error");
                }
            };
            
            const handleProfLogin = (profId) => {
                onLogin(tempClinic.id, profId);
            };

            const saveProfile = async () => {
                if (localDoctor) {
                    try {
                        let updatedDoctor = { ...localDoctor };
                        if (updatedDoctor.isClinic && updatedDoctor.professionals) {
                            const companyDays = updatedDoctor.workConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                            updatedDoctor.professionals = updatedDoctor.professionals.map(p => {
                                const pDays = (p.workConfig?.daysOfWeek || []).filter(d => companyDays.includes(d));
                                const pWorkConfig = { ...(p.workConfig || DEFAULT_WORK_CONFIG), daysOfWeek: pDays };
                                return {
                                    ...p,
                                    workConfig: pWorkConfig,
                                    schedule: generateScheduleFromConfig(pWorkConfig)
                                };
                            });
                        }
                        updatedDoctor.schedule = generateScheduleFromConfig(updatedDoctor.workConfig || DEFAULT_WORK_CONFIG);

                        setLocalDoctor(updatedDoctor);
                        const { id, ...updates } = updatedDoctor;
                        await setDoctors(id, updates);
                        showNotification("Perfil e agenda atualizados com sucesso!");
                    } catch (e) {
                        showNotification("Erro ao salvar perfil. Verifique sua conexão.", "error");
                    }
                }
            };

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (loggedInProfessionalId) {
                            updateActiveProfessional({ image: reader.result });
                        } else {
                            setLocalDoctor(prev => ({ ...prev, image: reader.result }));
                        }
                    };
                    reader.readAsDataURL(file);
                }
            };

            const toggleDay = (day) => {
                const target = displayDoctor;
                const currentDays = target.workConfig.daysOfWeek || [];
                const newDays = currentDays.includes(day) 
                    ? currentDays.filter(d => d !== day)
                    : [...currentDays, day].sort((a, b) => a - b);
                
                if (loggedInProfessionalId) {
                    const companyDays = localDoctor?.workConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                    if (!currentDays.includes(day) && !companyDays.includes(day)) {
                        showNotification("A empresa não atende neste dia da semana.", "error");
                        return;
                    }
                    updateActiveProfessional({ workConfig: { ...target.workConfig, daysOfWeek: newDays } });
                } else {
                    setLocalDoctor(prev => {
                        if (!prev) return null;
                        const updatedProfessionals = (prev.professionals || []).map(prof => {
                            const profDays = prof.workConfig?.daysOfWeek || [];
                            const filteredProfDays = profDays.filter(d => newDays.includes(d));
                            return {
                                ...prof,
                                workConfig: {
                                    ...(prof.workConfig || {}),
                                    daysOfWeek: filteredProfDays
                                }
                            };
                        });
                        return {
                            ...prev,
                            workConfig: { ...prev.workConfig, daysOfWeek: newDays },
                            professionals: updatedProfessionals
                        };
                    });
                }
            };

            const updateBreak = (type, field, value) => {
                const target = displayDoctor;
                const newBreaks = { ...(target.workConfig.breaks || {}) };
                newBreaks[type] = { ...(newBreaks[type] || {}), [field]: value };
                
                if (loggedInProfessionalId) {
                    updateActiveProfessional({ workConfig: { ...target.workConfig, breaks: newBreaks } });
                } else {
                    setLocalDoctor(prev => ({ ...prev, workConfig: { ...prev.workConfig, breaks: newBreaks } }));
                }
            };

            const applyGrouping = async () => {
                if (!displayDoctor || !localDoctor) return;
                const target = displayDoctor;
                const newConfig = { ...target.workConfig };
                const currentRules = [...(newConfig.groupingRules || [])];
                
                let updatedMaxSlotsPerTime = target.maxSlotsPerTime || 1;

                // If 'all' is selected, it's one rule for all slots
                if (selectedGroupingTimes.includes('all')) {
                    const newRule = {
                        id: Math.random().toString(36).substr(2, 9),
                        times: ['all'],
                        capacity: groupingQty,
                        type: groupingRuleType,
                    };
                    if (groupingRuleType === 'date') newRule.date = groupingRuleDate;
                    if (groupingRuleType === 'days') newRule.days = [...groupingRuleDays];
                    
                    currentRules.push(newRule);
                    if (newRule.type === 'all') {
                        newConfig.maxSlotsPerTime = groupingQty;
                        updatedMaxSlotsPerTime = groupingQty;
                    }
                } else {
                    // Group times by their capacity to create fewer rules
                    const capacityGroups = {};
                    selectedGroupingTimes.forEach(time => {
                        const cap = tempQuantities[time] || groupingQty;
                        if (!capacityGroups[cap]) capacityGroups[cap] = [];
                        capacityGroups[cap].push(time);
                    });

                    Object.entries(capacityGroups).forEach(([cap, times]) => {
                        const newRule = {
                            id: Math.random().toString(36).substr(2, 9),
                            times: times,
                            capacity: Number(cap),
                            type: groupingRuleType,
                        };
                        if (groupingRuleType === 'date') newRule.date = groupingRuleDate;
                        if (groupingRuleType === 'days') newRule.days = [...groupingRuleDays];
                        
                        currentRules.push(newRule);
                    });
                }

                newConfig.groupingRules = currentRules;
                
                // Prepare updates
                const updates = { 
                    workConfig: newConfig, 
                    maxSlotsPerTime: updatedMaxSlotsPerTime 
                };
                
                // Regenerate schedule automatically
                const updatedTarget = { ...target, ...updates };
                const newSchedule = generateScheduleFromConfig(updatedTarget.workConfig);
                const finalUpdates = { ...updates, schedule: newSchedule };

                // Update local state and Firestore
                try {
                    if (loggedInProfessionalId) {
                        const updatedProfessionals = (localDoctor.professionals || []).map(p => 
                            p.id === loggedInProfessionalId ? { ...p, ...finalUpdates } : p
                        );
                        const updatedDoctor = { ...localDoctor, professionals: updatedProfessionals };
                        setLocalDoctor(updatedDoctor);
                        await setDoctors(localDoctor.id, { professionals: updatedProfessionals });
                    } else {
                        const updatedDoctor = { ...localDoctor, ...finalUpdates };
                        setLocalDoctor(updatedDoctor);
                        await setDoctors(localDoctor.id, finalUpdates);
                    }
                    
                    showNotification("Regra aplicada e agenda salva com sucesso!");
                } catch (error) {
                    console.error("Erro ao aplicar regra:", error);
                    showNotification("Erro ao salvar regra. Verifique sua conexão.", "error");
                }
                
                // Reset grouping form
                setSelectedGroupingTimes(['all']);
                setGroupingRuleDate('');
                setGroupingRuleDays([]);
                setTimeToConfigure('all');
                setTempQuantities({});
                setGroupingRuleType('all');
            };

            const applySameQtyToAll = () => {
                const newTemp = { ...tempQuantities };
                selectedGroupingTimes.forEach(time => {
                    if (time !== 'all') newTemp[time] = groupingQty;
                });
                setTempQuantities(newTemp);
                showNotification(`Quantidade ${groupingQty} definida para todos os horários selecionados.`);
            };

            const toggleGroupingTime = (time) => {
                if (time === 'all') {
                    setSelectedGroupingTimes(['all']);
                    return;
                }
                
                setSelectedGroupingTimes(prev => {
                    const filtered = prev.filter(t => t !== 'all');
                    if (filtered.includes(time)) {
                        const next = filtered.filter(t => t !== time);
                        return next.length === 0 ? ['all'] : next;
                    }
                    return [...filtered, time];
                });
            };

            const getAllPossibleSlots = () => {
                if (!displayDoctor) return [];
                const slots = [];
                let currentMin = timeToMin(displayDoctor.workConfig.startTime);
                const endMin = timeToMin(displayDoctor.workConfig.endTime);
                const duration = displayDoctor.workConfig.slotDuration;
                const interval = displayDoctor.workConfig.minInterval || 0;
                while (currentMin + duration <= endMin) {
                    slots.push(minToTime(currentMin));
                    currentMin += duration + interval;
                }
                return slots;
            };

            const handleRegenerateSchedule = async () => {
                if (!displayDoctor || !localDoctor) return;
                const newSchedule = generateScheduleFromConfig(displayDoctor.workConfig);
                try {
                    if (loggedInProfessionalId) {
                        const updatedProfessionals = (localDoctor.professionals || []).map(p => 
                            p.id === loggedInProfessionalId ? { ...p, schedule: newSchedule, workConfig: displayDoctor.workConfig } : p
                        );
                        const updatedDoctor = { ...localDoctor, professionals: updatedProfessionals };
                        setLocalDoctor(updatedDoctor);
                        await setDoctors(localDoctor.id, { professionals: updatedProfessionals });
                    } else {
                        const companyDays = displayDoctor.workConfig.daysOfWeek || [];
                        const updatedProfessionals = (localDoctor.professionals || []).map(p => {
                            const pDays = (p.workConfig?.daysOfWeek || []).filter(d => companyDays.includes(d));
                            const pWorkConfig = { ...(p.workConfig || {}), daysOfWeek: pDays };
                            const pSchedule = generateScheduleFromConfig(pWorkConfig);
                            return {
                                ...p,
                                workConfig: pWorkConfig,
                                schedule: pSchedule
                            };
                        });
                        const updatedDoctor = { 
                            ...localDoctor, 
                            schedule: newSchedule, 
                            workConfig: displayDoctor.workConfig,
                            professionals: updatedProfessionals
                        };
                        setLocalDoctor(updatedDoctor);
                        await setDoctors(localDoctor.id, { 
                            schedule: newSchedule, 
                            workConfig: displayDoctor.workConfig,
                            professionals: updatedProfessionals
                        });
                    }
                    showNotification("Agenda regerada e atualizada com sucesso!");
                } catch (e) {
                    console.error("Erro ao regerar agenda:", e);
                    showNotification("Erro ao atualizar agenda no servidor.", "error");
                }
            };

            const updateActiveProfessional = (updates) => {
                if (!loggedInProfessionalId || !localDoctor) return;
                setLocalDoctor(prev => prev ? ({
                    ...prev,
                    professionals: (prev.professionals || []).map(p => p.id === loggedInProfessionalId ? { ...p, ...updates } : p)
                }) : null);
            };

            if (!loggedInDoctor) return (
                <div className="lg:max-w-none mx-auto mt-20 bg-white p-8 border-2 border-slate-200 border-b-4 border-red-600 text-center shadow-2xl animate-slide-up">
                    <h2 className="text-slate-900 font-black uppercase mb-8 tracking-widest">Acesso Profissional</h2>
                    {loginStep === 'password' ? (
                        <div className="space-y-4">
                            <input type="password" placeholder="SUA SENHA" className="w-full p-4 border border-slate-200 text-center font-black uppercase text-xs outline-none focus:border-red-600" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} />
                            <button onClick={handleLogin} className="w-full py-4 bg-red-600 text-white font-black uppercase text-xs hover:bg-red-700 transition-all active-scale">ENTRAR</button>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            <p className="text-[10px] text-slate-900 font-black uppercase mb-4">Selecione quem está acessando:</p>
                            <button onClick={() => onLogin(tempClinic.id)} className="w-full py-4 bg-white border border-slate-900 text-slate-900 font-black uppercase text-xs hover:bg-slate-50 transition-all">PAINEL DA EMPRESA</button>
                            <div className="h-px bg-slate-200 my-4"></div>
                            {(tempClinic?.professionals || []).map(prof => (
                                <button key={prof.id} onClick={() => handleProfLogin(prof.id)} className="w-full py-3 bg-white border border-slate-200 text-slate-900 font-black uppercase text-[10px] hover:bg-slate-50 transition-all mb-2 flex items-center justify-between px-4">
                                    <span>{prof.name}</span>
                                    {prof.status === 'suspended' && <span className="text-[9px] text-red-600 font-black uppercase">(SUSPENSO)</span>}
                                </button>
                            ))}
                            <button onClick={() => setLoginStep('password')} className="w-full py-2 text-slate-900 font-black uppercase text-[8px] mt-4">VOLTAR</button>
                        </div>
                    )}
                </div>
            );

            const isCompanyView = loggedInDoctor?.isClinic && !loggedInProfessionalId;
            const activeProfessional = loggedInProfessionalId 
                ? ((localDoctor?.professionals || []).find(p => p.id === loggedInProfessionalId) || (loggedInDoctor?.professionals || []).find(p => p.id === loggedInProfessionalId)) 
                : null;
            const displayDoctor = activeProfessional || localDoctor || loggedInDoctor;

            if (!loggedInDoctor || !localDoctor) return <div className="p-20 text-center font-black uppercase text-slate-900">Carregando painel...</div>;

            const doctorAppointments = appointments.filter(a => 
                a.doctorId === loggedInId && 
                (!loggedInProfessionalId || a.professionalId === loggedInProfessionalId)
            );

            const handleAddProfessional = () => {
                if (!newProf.name || !localDoctor) return;
                const companyDays = localDoctor.workConfig?.daysOfWeek || [1, 2, 3, 4, 5];
                const initialWorkConfig = JSON.parse(JSON.stringify(localDoctor.workConfig || DEFAULT_WORK_CONFIG));
                initialWorkConfig.daysOfWeek = [...companyDays];

                const prof = {
                    id: Math.random().toString(36).substr(2, 9),
                    name: newProf.name,
                    specialties: newProf.specialties.split(',').map(s => s.trim()),
                    image: newProf.image,
                    status: 'active',
                    workConfig: initialWorkConfig,
                    maxSlotsPerTime: 1,
                    slotCapacities: {}
                };
                // Generate initial schedule for the new professional
                prof.schedule = generateScheduleFromConfig(prof.workConfig);
                
                setLocalDoctor(prev => prev ? ({ ...prev, professionals: [...(prev.professionals || []), prof] }) : null);
                setNewProf({ name: '', specialties: '', image: '' });
                showNotification("Profissional adicionado. Lembre-se de clicar em SALVAR ALTERAÇÕES no final da página.");
            };

            const handleDeleteProfessional = (id) => {
                if (!localDoctor) return;
                showConfirmation("Deseja excluir este profissional?", () => {
                    setLocalDoctor(prev => prev ? ({ ...prev, professionals: (prev.professionals || []).filter(p => p.id !== id) }) : null);
                });
            };

            const handleUpdateProfessional = async (id, updates) => {
                if (!localDoctor) return;
                const updatedProfessionals = (localDoctor.professionals || []).map(p => p.id === id ? { ...p, ...updates } : p);
                const updatedDoctor = { ...localDoctor, professionals: updatedProfessionals };
                setLocalDoctor(updatedDoctor);
                try {
                    const { id: docId, ...dataUpdates } = updatedDoctor;
                    await setDoctors(docId, dataUpdates);
                } catch (err) {
                    console.error("Erro ao atualizar profissional:", err);
                }
            };

            const renderAppointmentCards = (appsList) => {
                const activeApps = appsList.filter(a => a.status !== 'cancelled');
                const cancelledApps = appsList.filter(a => a.status === 'cancelled');

                const renderGrouped = (list) => {
                    const grouped = list.reduce((acc, app) => {
                        const key = `${formatDateLong(app.date)} | ${app.time}`;
                        if (!acc[key]) acc[key] = [];
                        acc[key].push(app);
                        return acc;
                    }, {});

                    return Object.entries(grouped)
                        .sort((a, b) => a[0].localeCompare(b[0]))
                        .map(([slotKey, apps]) => (
                            <div key={slotKey} className="border border-slate-200 bg-white overflow-hidden shadow-sm hover:border-red-600 transition-all">
                                <div className="bg-white border-b border-slate-200 p-4 flex justify-between items-center">
                                    <h4 className="text-slate-900 font-black text-xs uppercase tracking-widest">
                                        <i className="fas fa-clock mr-2 text-red-600"></i> {slotKey}
                                    </h4>
                                    <span className="text-xs font-black text-slate-900 uppercase">{apps.length} PACIENTE(S)</span>
                                </div>
                                <div className="divide-y divide-slate-100">
                                    {apps.map(app => (
                                        <div key={app.id} className={`p-6 flex flex-col md:flex-row justify-between items-center gap-6 transition-all ${app.status === 'cancelled' ? 'opacity-50 bg-slate-50' : 'bg-white'}`}>
                                            <div className="flex gap-6 items-center w-full md:w-auto">
                                                <div className={`w-16 h-16 flex flex-col items-center justify-center font-black shrink-0 ${app.status === 'cancelled' ? 'bg-slate-200 text-slate-900' : 'bg-red-600 text-white shadow-lg'}`}>
                                                    <span className="text-[18px]">{app.time}</span>
                                                </div>
                                                <div>
                                                    <p className="font-black uppercase text-slate-900 text-lg">{app.patientName}</p>
                                                    <p className="text-xs font-bold text-slate-900 uppercase tracking-widest">{app.patientCPF} • {app.patientPhone}</p>
                                                    {app.document && (
                                                        <p className="text-[8px] font-black text-emerald-600 uppercase mt-1">
                                                            <i className="fas fa-file-alt mr-1"></i>
                                                            Documento: {app.document.name}
                                                        </p>
                                                    )}
                                                    {isCompanyView && (
                                                        <p className="text-[8px] font-black text-red-600 uppercase mt-1">
                                                            <i className="fas fa-user-md mr-1"></i>
                                                            Profissional: {(localDoctor?.professionals || []).find(p => p.id === app.professionalId)?.name || 'Clínica'}
                                                        </p>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4 w-full md:w-auto justify-end">
                                                {app.status === 'cancelled' ? (
                                                    <button 
                                                        onClick={() => {
                                                            setReschedulingApp(app);
                                                            setNewRescheduleDate(app.date || '');
                                                            setNewRescheduleTime(app.time || '08:00');
                                                        }} 
                                                        className="px-6 py-2 bg-red-600 text-white text-xs font-black uppercase hover:bg-red-700 transition-colors active-scale flex items-center gap-2 shadow-sm"
                                                    >
                                                        <i className="fas fa-calendar-alt"></i> REAGENDAR
                                                    </button>
                                                ) : (
                                                    <>
                                                        <div className="relative">
                                                            <input 
                                                                type="file" 
                                                                id={`file-${app.id}`} 
                                                                className="hidden" 
                                                                onChange={async (e) => {
                                                                    const file = e.target.files[0];
                                                                    if (file) {
                                                                        const reader = new FileReader();
                                                                        reader.onload = async (event) => {
                                                                            await onUpdateAppointment(app.id, { 
                                                                                document: { 
                                                                                    name: file.name, 
                                                                                    data: event.target.result 
                                                                                } 
                                                                            });
                                                                            showNotification('Documento anexado com sucesso!');
                                                                        };
                                                                        reader.readAsDataURL(file);
                                                                    }
                                                                }} 
                                                            />
                                                            <label 
                                                                htmlFor={`file-${app.id}`} 
                                                                className="px-4 py-2 bg-slate-100 text-slate-900 text-xs font-black uppercase cursor-pointer hover:bg-red-600 hover:text-white transition-all flex items-center gap-2"
                                                            >
                                                                <i className="fas fa-paperclip"></i> {app.document ? 'ALTERAR DOC' : 'ANEXAR DOC'}
                                                            </label>
                                                        </div>
                                                        <button onClick={() => onCancelAppointment(app.id)} className="px-6 py-2 border-2 border-red-600 text-red-600 text-xs font-black uppercase hover:bg-red-600 hover:text-white transition-colors active-scale">CANCELAR</button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ));
                };

                return (
                    <div className="space-y-12">
                        {activeApps.length > 0 ? (
                            <div className="grid grid-cols-1 gap-6">
                                {renderGrouped(activeApps)}
                            </div>
                        ) : (
                            <p className="py-8 text-center text-xs font-black text-slate-900 uppercase italic bg-slate-50 border border-dashed border-slate-200">Nenhum agendamento ativo.</p>
                        )}
                        
                        {cancelledApps.length > 0 && (
                            <div className="space-y-6 pt-6 border-t-2 border-slate-300">
                                <div className="flex items-center gap-4">
                                    <div className="h-0.5 bg-slate-300 flex-grow"></div>
                                    <span className="text-xs font-black text-red-600 uppercase tracking-[0.2em] bg-red-50 px-4 py-2 border border-red-200 flex items-center gap-2 shadow-sm">
                                        <i className="fas fa-ban"></i>
                                        Agendamentos Cancelados ({cancelledApps.length})
                                    </span>
                                    <div className="h-0.5 bg-slate-300 flex-grow"></div>
                                </div>
                                <div className="grid grid-cols-1 gap-6 opacity-75">
                                    {renderGrouped(cancelledApps)}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };
